<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">From model to TensorRT engine</title><desc id="d">Train a model, export ONNX with fixed shapes, build an engine with trtexec on the Jetson, then run it.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="250" rx="14" fill="#120d1c"/><text x="320" y="24" font-size="15" fill="#b26bff" text-anchor="middle" font-weight="700" >Model to engine</text><rect x="14" y="54" width="112" height="84" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="70" y="84" font-size="13.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >PyTorch / TF</text><text x="70" y="104" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >train anywhere</text><line x1="127" y1="96" x2="138" y2="96" stroke="#4fa8ff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="139" y="54" width="112" height="84" rx="10" fill="#1c1530" stroke="#b26bff" stroke-width="1.5"/><text x="195" y="84" font-size="13.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >ONNX</text><text x="195" y="104" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >fixed shapes</text><line x1="252" y1="96" x2="263" y2="96" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="264" y="54" width="112" height="84" rx="10" fill="#1c1530" stroke="#76b900" stroke-width="1.5"/><text x="320" y="84" font-size="13.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >trtexec</text><text x="320" y="104" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >on the Jetson</text><line x1="377" y1="96" x2="388" y2="96" stroke="#76b900" stroke-width="1.8" marker-end="url(#ah)"/><rect x="389" y="54" width="112" height="84" rx="10" fill="#1c1530" stroke="#e06aa8" stroke-width="1.5"/><text x="445" y="84" font-size="13.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >Engine</text><text x="445" y="104" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >device + version</text><text x="445" y="118" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >specific</text><line x1="502" y1="96" x2="513" y2="96" stroke="#e06aa8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="514" y="54" width="112" height="84" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="570" y="84" font-size="13.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >Run</text><text x="570" y="104" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >Python / C++ /</text><text x="570" y="118" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >DeepStream</text><rect x="14" y="160" width="612" height="62" rx="10" fill="#241a3c" stroke="#3d2f5c" stroke-width="1.5"/><text x="320" y="184" font-size="11" fill="#efe9ff" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,monospace">trtexec --onnx=model.onnx --fp16 [--useDLACore=0 --allowGPUFallback] --saveEngine=m.engine</text><text x="320" y="206" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >Build on the device that will run it; engines do not carry across TensorRT versions.</text></svg>
