<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Jetson software stack</title><desc id="d">Layers from hardware up to your application, with the library that reaches each processor, and which JetPack lines support the Xavier.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="430" rx="14" fill="#120d1c"/><text x="320" y="24" font-size="15" fill="#b26bff" text-anchor="middle" font-weight="700" >The software stack (top to bottom)</text><rect x="20" y="40" width="600" height="36" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="320" y="63" font-size="12.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >Your application (Python / C++)</text><rect x="20" y="84" width="600" height="36" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="320" y="107" font-size="12.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >Frameworks: PyTorch, ONNX Runtime, DeepStream</text><rect x="20" y="128" width="600" height="36" rx="10" fill="#1c1530" stroke="#b26bff" stroke-width="1.5"/><text x="320" y="151" font-size="12.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >Libraries: TensorRT, cuDNN, CUDA, VPI, GStreamer, Argus</text><rect x="20" y="172" width="600" height="36" rx="10" fill="#1c1530" stroke="#e06aa8" stroke-width="1.5"/><text x="320" y="195" font-size="12.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >Jetson Linux (L4T): Ubuntu userland, kernel, drivers</text><rect x="20" y="216" width="600" height="36" rx="10" fill="#1c1530" stroke="#a99dc7" stroke-width="1.5"/><text x="320" y="239" font-size="12.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >Boot firmware, power and safety firmware</text><rect x="20" y="260" width="600" height="36" rx="10" fill="#1c1530" stroke="#76b900" stroke-width="1.5"/><text x="320" y="283" font-size="12.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >Hardware: CPU, GPU, 2x DLA, 2x PVA, ISP, VIC, NVENC/NVDEC</text><text x="320" y="316" font-size="12.5" fill="#a99dc7" text-anchor="middle" font-weight="700" >Who reaches which processor</text><rect x="20" y="326" width="114" height="40" rx="10" fill="#1c1530" stroke="#e06aa8" stroke-width="1.5"/><text x="77" y="343" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >TensorRT</text><text x="77" y="358" font-size="9.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >GPU + DLA</text><rect x="142" y="326" width="114" height="40" rx="10" fill="#1c1530" stroke="#76b900" stroke-width="1.5"/><text x="199" y="343" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >CUDA / cuDNN</text><text x="199" y="358" font-size="9.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >GPU</text><rect x="264" y="326" width="114" height="40" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="321" y="343" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >VPI</text><text x="321" y="358" font-size="9.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >PVA, VIC, GPU</text><rect x="386" y="326" width="114" height="40" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="443" y="343" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >GStreamer</text><text x="443" y="358" font-size="9.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >NVENC, NVDEC, VIC</text><rect x="508" y="326" width="114" height="40" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="565" y="343" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >Argus</text><text x="565" y="358" font-size="9.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >ISP</text><rect x="20" y="380" width="190" height="38" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="115" y="396" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >JetPack 4.6.x</text><text x="115" y="411" font-size="9.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >Ubuntu 18.04 (end of life)</text><rect x="225" y="380" width="190" height="38" rx="10" fill="#1c1530" stroke="#76b900" stroke-width="1.5"/><text x="320" y="396" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >JetPack 5.1.x</text><text x="320" y="411" font-size="9.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >Ubuntu 20.04, CUDA 11.4, TRT 8.5</text><rect x="430" y="380" width="190" height="38" rx="10" fill="#1c1530" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="525" y="396" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >JetPack 6</text><text x="525" y="411" font-size="9.5" fill="#ff6b6b" text-anchor="middle" font-weight="400" >does not support Xavier</text></svg>
