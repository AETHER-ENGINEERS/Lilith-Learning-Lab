<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">DLA subgraphs and fallbacks</title><desc id="d">A good model keeps layers on the DLA and puts non-DLA layers at the end; a bad one bounces between DLA and GPU.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="330" rx="14" fill="#120d1c"/><text x="320" y="24" font-size="15" fill="#b26bff" text-anchor="middle" font-weight="700" >Keep the DLA part in one piece</text><text x="20" y="58" font-size="12" fill="#76b900" text-anchor="start" font-weight="700" >Good: 1 DLA subgraph, GPU only for the tail</text><rect x="14" y="66" width="48.8" height="34" rx="8" fill="#16241a" stroke="#76b900" stroke-width="1.5"/><text x="38.4" y="87" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >conv</text><rect x="68.8" y="66" width="48.8" height="34" rx="8" fill="#16241a" stroke="#76b900" stroke-width="1.5"/><text x="93.19999999999999" y="87" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >relu</text><rect x="123.6" y="66" width="48.8" height="34" rx="8" fill="#16241a" stroke="#76b900" stroke-width="1.5"/><text x="148.0" y="87" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >conv</text><rect x="178.39999999999998" y="66" width="48.8" height="34" rx="8" fill="#16241a" stroke="#76b900" stroke-width="1.5"/><text x="202.79999999999998" y="87" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >relu</text><rect x="233.2" y="66" width="84.8" height="34" rx="8" fill="#16241a" stroke="#76b900" stroke-width="1.5"/><text x="275.59999999999997" y="87" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >resize x2</text><rect x="324.0" y="66" width="48.8" height="34" rx="8" fill="#16241a" stroke="#76b900" stroke-width="1.5"/><text x="348.4" y="87" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >conv</text><text x="375.8" y="116" font-size="8.5" fill="#ff6b6b" text-anchor="middle" font-weight="400" >copy+sync</text><rect x="378.8" y="66" width="70.4" height="34" rx="8" fill="#2d2410" stroke="#e3b341" stroke-width="1.5"/><text x="414.0" y="87" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >softmax</text><rect x="455.20000000000005" y="66" width="63.2" height="34" rx="8" fill="#2d2410" stroke="#e3b341" stroke-width="1.5"/><text x="486.80000000000007" y="87" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >argmax</text><text x="20" y="168" font-size="12" fill="#ff6b6b" text-anchor="start" font-weight="700" >Bad: many DLA/GPU switches</text><rect x="14" y="176" width="48.8" height="34" rx="8" fill="#16241a" stroke="#76b900" stroke-width="1.5"/><text x="38.4" y="197" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >conv</text><text x="65.8" y="226" font-size="8.5" fill="#ff6b6b" text-anchor="middle" font-weight="400" >copy+sync</text><rect x="68.8" y="176" width="48.8" height="34" rx="8" fill="#2d2410" stroke="#e3b341" stroke-width="1.5"/><text x="93.19999999999999" y="197" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >gelu</text><text x="120.6" y="226" font-size="8.5" fill="#ff6b6b" text-anchor="middle" font-weight="400" >copy+sync</text><rect x="123.6" y="176" width="48.8" height="34" rx="8" fill="#16241a" stroke="#76b900" stroke-width="1.5"/><text x="148.0" y="197" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >conv</text><text x="175.39999999999998" y="226" font-size="8.5" fill="#ff6b6b" text-anchor="middle" font-weight="400" >copy+sync</text><rect x="178.39999999999998" y="176" width="70.4" height="34" rx="8" fill="#2d2410" stroke="#e3b341" stroke-width="1.5"/><text x="213.59999999999997" y="197" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >softmax</text><rect x="254.79999999999998" y="176" width="84.8" height="34" rx="8" fill="#2d2410" stroke="#e3b341" stroke-width="1.5"/><text x="297.2" y="197" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >deconv p1</text><text x="342.59999999999997" y="226" font-size="8.5" fill="#ff6b6b" text-anchor="middle" font-weight="400" >copy+sync</text><rect x="345.59999999999997" y="176" width="48.8" height="34" rx="8" fill="#16241a" stroke="#76b900" stroke-width="1.5"/><text x="369.99999999999994" y="197" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >relu</text><rect x="14" y="266" width="14" height="14" rx="3" fill="#16241a" stroke="#76b900" stroke-width="1.5"/><text x="34" y="278" font-size="11" fill="#a99dc7" text-anchor="start" font-weight="400" >runs on DLA</text><rect x="130" y="266" width="14" height="14" rx="3" fill="#2d2410" stroke="#e3b341" stroke-width="1.5"/><text x="150" y="278" font-size="11" fill="#a99dc7" text-anchor="start" font-weight="400" >falls back to GPU</text><text x="320" y="312" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >Each switch adds data copies and synchronization. Check the --verbose build log.</text></svg>
