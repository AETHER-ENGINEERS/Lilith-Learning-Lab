<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Flashing a Jetson</title><desc id="d">Four steps: enter recovery mode, check USB, choose the JetPack version in SDK Manager, then flash and first boot.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="250" rx="14" fill="#120d1c"/><text x="320" y="24" font-size="15" fill="#b26bff" text-anchor="middle" font-weight="700" >Flashing from a host PC</text><rect x="14" y="48" width="146" height="150" rx="10" fill="#1c1530" stroke="#b26bff" stroke-width="1.5"/><circle cx="87" cy="76" r="14" fill="#b26bff"/><text x="87" y="81" font-size="14" fill="#12081f" text-anchor="middle" font-weight="800" >1</text><text x="87" y="112" font-size="13.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >Recovery mode</text><text x="87" y="138" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >power off, hold Force</text><text x="87" y="154" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >Recovery, press Power</text><line x1="161" y1="123" x2="170" y2="123" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="171" y="48" width="146" height="150" rx="10" fill="#1c1530" stroke="#b26bff" stroke-width="1.5"/><circle cx="244" cy="76" r="14" fill="#b26bff"/><text x="244" y="81" font-size="14" fill="#12081f" text-anchor="middle" font-weight="800" >2</text><text x="244" y="112" font-size="13.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >Check USB</text><text x="244" y="138" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >host: lsusb lists an</text><text x="244" y="154" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >NVIDIA device</text><line x1="318" y1="123" x2="327" y2="123" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="328" y="48" width="146" height="150" rx="10" fill="#1c1530" stroke="#b26bff" stroke-width="1.5"/><circle cx="401" cy="76" r="14" fill="#b26bff"/><text x="401" y="81" font-size="14" fill="#12081f" text-anchor="middle" font-weight="800" >3</text><text x="401" y="112" font-size="13.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >SDK Manager</text><text x="401" y="138" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >pick Jetson AGX Xavier</text><text x="401" y="154" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >and JetPack 5.1.x</text><line x1="475" y1="123" x2="484" y2="123" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="485" y="48" width="146" height="150" rx="10" fill="#1c1530" stroke="#b26bff" stroke-width="1.5"/><circle cx="558" cy="76" r="14" fill="#b26bff"/><text x="558" y="81" font-size="14" fill="#12081f" text-anchor="middle" font-weight="800" >4</text><text x="558" y="112" font-size="13.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >Flash + boot</text><text x="558" y="138" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >first boot setup, then</text><text x="558" y="154" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >apt install nvidia-jetpack</text><text x="320" y="228" font-size="11.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >Host: x86-64 Ubuntu PC + USB-C cable. Re-flashing erases the device storage.</text></svg>
