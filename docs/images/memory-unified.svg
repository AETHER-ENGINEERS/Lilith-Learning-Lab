<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Unified memory on Jetson</title><desc id="d">On a PC the CPU and GPU have separate memories joined by a copy over PCIe; on Jetson every processor uses the same LPDDR4x.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="300" rx="14" fill="#120d1c"/><text x="160" y="26" font-size="14" fill="#a99dc7" text-anchor="middle" font-weight="700" >Desktop PC</text><rect x="20" y="44" width="120" height="50" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="80.0" y="74.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >CPU</text><rect x="20" y="170" width="120" height="50" rx="10" fill="#1c1530" stroke="#76b900" stroke-width="1.5"/><text x="80.0" y="200.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >GPU</text><rect x="180" y="44" width="120" height="50" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="240.0" y="74.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >System RAM</text><rect x="180" y="170" width="120" height="50" rx="10" fill="#1c1530" stroke="#76b900" stroke-width="1.5"/><text x="240.0" y="200.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >GPU VRAM</text><line x1="140" y1="69" x2="180" y2="69" stroke="#a99dc7" stroke-width="1.8" marker-end="url(#ah)"/><line x1="140" y1="195" x2="180" y2="195" stroke="#a99dc7" stroke-width="1.8" marker-end="url(#ah)"/><line x1="240" y1="94" x2="240" y2="170" stroke="#ff6b6b" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="240" y="138" font-size="10.5" fill="#ff6b6b" text-anchor="middle" font-weight="400" >copy over PCIe</text><text x="480" y="26" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >Jetson AGX Xavier</text><rect x="350" y="44" width="60" height="44" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="380.0" y="71.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >CPU</text><line x1="380" y1="88" x2="380" y2="150" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="418" y="44" width="60" height="44" rx="10" fill="#1c1530" stroke="#76b900" stroke-width="1.5"/><text x="448.0" y="71.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >GPU</text><line x1="448" y1="88" x2="448" y2="150" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="486" y="44" width="60" height="44" rx="10" fill="#1c1530" stroke="#e06aa8" stroke-width="1.5"/><text x="516.0" y="71.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >DLA</text><line x1="516" y1="88" x2="516" y2="150" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="554" y="44" width="60" height="44" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="584.0" y="71.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >PVA</text><line x1="584" y1="88" x2="584" y2="150" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="350" y="152" width="272" height="54" rx="10" fill="#241a3c" stroke="#e06aa8" stroke-width="1.5"/><text x="486" y="176" font-size="13.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >one LPDDR4x pool</text><text x="486" y="194" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >~136.5 GB/s shared</text><text x="486" y="236" font-size="12" fill="#76b900" text-anchor="middle" font-weight="600" >No copies needed (zero-copy)</text><text x="486" y="254" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >but everything competes for the same bandwidth</text><line x1="320" y1="36" x2="320" y2="270" stroke="#3d2f5c" stroke-width="1" stroke-dasharray="4 4"/></svg>
