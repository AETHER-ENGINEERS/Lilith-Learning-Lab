<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Always-on perception loop</title><desc id="d">The DLA reconstructs the scene all the time; the CPU compares it with the frame; the GPU detector wakes only when the error is high.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="320" rx="14" fill="#120d1c"/><text x="320" y="24" font-size="15" fill="#b26bff" text-anchor="middle" font-weight="700" >The Sentry loop: sleep cheap, wake smart</text><rect x="14" y="50" width="118" height="62" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="73.0" y="78.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Camera</text><text x="73.0" y="95.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >ISP + VIC 256x256</text><rect x="158" y="50" width="138" height="62" rx="10" fill="#1c1530" stroke="#e06aa8" stroke-width="1.5"/><text x="227.0" y="78.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >DLA 0</text><text x="227.0" y="95.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >encoder (mu) + decoder</text><rect x="322" y="50" width="138" height="62" rx="10" fill="#1c1530" stroke="#76b900" stroke-width="1.5"/><text x="391.0" y="78.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >CPU</text><text x="391.0" y="95.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >error = |x - recon|</text><line x1="133" y1="81" x2="157" y2="81" stroke="#4fa8ff" stroke-width="1.8" marker-end="url(#ah)"/><line x1="297" y1="81" x2="321" y2="81" stroke="#e06aa8" stroke-width="1.8" marker-end="url(#ah)"/><polygon points="545,48 625,81 545,114 465,81" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="545" y="78" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >error &gt;</text><text x="545" y="93" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >threshold?</text><line x1="461" y1="81" x2="466" y2="81" stroke="#76b900" stroke-width="1.8" marker-end="url(#ah)"/><rect x="30" y="190" width="250" height="62" rx="10" fill="#16241a" stroke="#76b900" stroke-width="1.5"/><text x="155" y="214" font-size="13.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >No: GPU stays idle</text><text x="155" y="234" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >keep looping at low power</text><rect x="360" y="190" width="250" height="62" rx="10" fill="#2d1830" stroke="#e06aa8" stroke-width="1.5"/><text x="485" y="214" font-size="13.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >Yes: wake the GPU</text><text x="485" y="234" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >full-frame detector, then handle events</text><line x1="520" y1="108" x2="485" y2="190" stroke="#e06aa8" stroke-width="1.8" marker-end="url(#ah)"/><line x1="520" y1="108" x2="200" y2="190" stroke="#76b900" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ah)"/><text x="320" y="290" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >Add a watchdog: if the DLA engine stalls, fall back to a simple CPU or GPU check.</text></svg>
