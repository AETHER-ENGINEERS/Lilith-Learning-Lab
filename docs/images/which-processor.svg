<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Which processor for which job</title><desc id="d">Workloads on the left map to the processor and the software that drives it on the right.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="392" rx="14" fill="#120d1c"/><text x="320" y="24" font-size="15" fill="#b26bff" text-anchor="middle" font-weight="700" >Pick the cheapest processor that can do the job</text><rect x="20" y="42" width="244" height="38" rx="10" fill="#1c1530" stroke="#3d2f5c" stroke-width="1.5"/><text x="142" y="66" font-size="12" fill="#efe9ff" text-anchor="middle" font-weight="400" >Python, JSON, networking</text><line x1="266" y1="66" x2="378" y2="66" stroke="#4fa8ff" stroke-width="1.8" marker-end="url(#ah)"/><text x="322" y="56" font-size="9" fill="#a99dc7" text-anchor="middle" font-weight="400" >Linux</text><rect x="380" y="42" width="240" height="38" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="500" y="66" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="700" >CPU</text><rect x="20" y="90" width="244" height="38" rx="10" fill="#1c1530" stroke="#3d2f5c" stroke-width="1.5"/><text x="142" y="114" font-size="12" fill="#efe9ff" text-anchor="middle" font-weight="400" >Custom CUDA kernels, PyTorch</text><line x1="266" y1="114" x2="378" y2="114" stroke="#76b900" stroke-width="1.8" marker-end="url(#ah)"/><text x="322" y="104" font-size="9" fill="#a99dc7" text-anchor="middle" font-weight="400" >CUDA, cuDNN</text><rect x="380" y="90" width="240" height="38" rx="10" fill="#1c1530" stroke="#76b900" stroke-width="1.5"/><text x="500" y="114" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="700" >GPU</text><rect x="20" y="13