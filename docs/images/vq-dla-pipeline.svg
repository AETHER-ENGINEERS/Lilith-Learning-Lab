<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">VQ-VAE on the DLA</title><desc id="d">Encoder and codebook scores run on the DLA, argmin and lookup on CPU or GPU, then the decoder runs on the DLA.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="300" rx="14" fill="#120d1c"/><text x="320" y="24" font-size="15" fill="#b26bff" text-anchor="middle" font-weight="700" >VQ-VAE split: tensors on the DLA, the choice on the CPU</text><rect x="20" y="50" width="180" height="62" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="110.0" y="78.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Camera frame</text><text x="110.0" y="95.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >256x256</text><line x1="202" y1="81" x2="223" y2="81" stroke="#4fa8ff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="225" y="50" width="180" height="62" rx="10" fill="#1c1530" stroke="#e06aa8" stroke-width="1.5"/><text x="315.0" y="78.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Encoder</text><text x="315.0" y="95.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >conv stack (DLA)</text><line x1="407" y1="81" x2="428" y2="81" stroke="#e06aa8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="430" y="50" width="180" height="62" rx="10" fill="#1c1530" stroke="#e06aa8" stroke-width="1.5"/><text x="520.0" y="78.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Scores</text><text x="520.0" y="95.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >1x1 conv (DLA)</text><rect x="20" y="136" width="600" height="40" rx="10" fill="#241a3c" stroke="#e3b341" stroke-width="1.5"/><text x="320" y="154" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="600" >argmin over the score channels: score_k = ||b_k||^2 - 2 a.b_k   (CPU or GPU)</text><text x="320" y="169" font-size="10" fill="#a99dc7" text-anchor="middle" font-weight="400" >||a||^2 is the same for every k, so it is dropped</text><line x1="525" y1="112" x2="525" y2="136" stroke="#e3b341" stroke-width="1.8" marker-end="url(#ah)"/><line x1="525" y1="176" x2="525" y2="200" stroke="#e3b341" stroke-width="1.8" marker-end="url(#ah)"/><rect x="435" y="200" width="180" height="62" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="525.0" y="228.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Reconstruction</text><text x="525.0" y="245.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >image out</text><line x1="433" y1="231" x2="412" y2="231" stroke="#4fa8ff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="230" y="200" width="180" height="62" rx="10" fill="#1c1530" stroke="#e06aa8" stroke-width="1.5"/><text x="320.0" y="228.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Decoder</text><text x="320.0" y="245.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >resize + conv (DLA)</text><line x1="228" y1="231" x2="207" y2="231" stroke="#e06aa8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="25" y="200" width="180" height="62" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="115.0" y="228.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Lookup</text><text x="115.0" y="245.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >codebook[idx] (CPU/GPU)</text><text x="320" y="288" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >Two hand-offs between DLA and CPU per frame: measure them.</text></svg>
