<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Xavier SoC block diagram</title><desc id="d">CPU, GPU, two DLAs, two PVAs, ISP, VIC and video engines all connect through a shared memory fabric to one LPDDR4x memory.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="400" rx="14" fill="#120d1c"/><text x="320" y="26" font-size="15" fill="#b26bff" text-anchor="middle" font-weight="700" >Xavier SoC: one chip, many processors</text><rect x="20" y="44" width="135" height="70" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="87.5" y="76.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >8x Carmel CPU</text><text x="87.5" y="93.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >Linux, Python, glue</text><rect x="175" y="44" width="135" height="70" rx="10" fill="#1c1530" stroke="#76b900" stroke-width="1.5"/><text x="242.5" y="76.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Volta GPU</text><text x="242.5" y="93.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >512 CUDA + 64 Tensor</text><rect x="330" y="44" width="135" height="70" rx="10" fill="#1c1530" stroke="#e06aa8" stroke-width="1.5"/><text x="397.5" y="76.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >DLA 0</text><text x="397.5" y="93.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >fixed-function NN</text><rect x="485" y="44" width="135" height="70" rx="10" fill="#1c1530" stroke="#e06aa8" stroke-width="1.5"/><text x="552.5" y="76.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >DLA 1</text><text x="552.5" y="93.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >fixed-function NN</text><line x1="87" y1="114" x2="87" y2="150" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><line x1="242" y1="114" x2="242" y2="150" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><line x1="397" y1="114" x2="397" y2="150" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><line x1="552" y1="114" x2="552" y2="150" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="152" width="600" height="34" rx="10" fill="#2a1f45" stroke="#b26bff" stroke-width="1.5"/><text x="320" y="174" font-size="12.5" fill="#efe9ff" text-anchor="middle" font-weight="600" >Shared memory fabric (every block competes for bandwidth)</text><rect x="20" y="214" width="125" height="66" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="82.5" y="244.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >2x PVA</text><text x="82.5" y="261.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >classic vision (VPI)</text><rect x="155" y="214" width="125" height="66" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="217.5" y="244.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >ISP</text><text x="217.5" y="261.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >camera raw to image</text><rect x="290" y="214" width="125" height="66" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="352.5" y="244.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >VIC</text><text x="352.5" y="261.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >scale / convert</text><rect x="425" y="214" width="125" height="66" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="487.5" y="244.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >NVENC / NVDEC</text><text x="487.5" y="261.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >video codec</text><line x1="82" y1="186" x2="82" y2="214" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><line x1="217" y1="186" x2="217" y2="214" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><line x1="352" y1="186" x2="352" y2="214" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><line x1="487" y1="186" x2="487" y2="214" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><line x1="586" y1="186" x2="586" y2="326" stroke="#b26bff" stroke-width="2.2"/><line x1="586" y1="300" x2="586" y2="328" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="328" width="600" height="48" rx="10" fill="#241a3c" stroke="#e06aa8" stroke-width="1.5"/><text x="320" y="349" font-size="13.5" fill="#efe9ff" text-anchor="middle" font-weight="700" >LPDDR4x memory, 256-bit, about 136.5 GB/s</text><text x="320" y="367" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >16 / 32 / 64 GB, one pool for CPU, GPU and accelerators (no separate GPU memory)</text><text x="320" y="303" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >plus small helper cores for boot, power and safety (from memory)</text></svg>
