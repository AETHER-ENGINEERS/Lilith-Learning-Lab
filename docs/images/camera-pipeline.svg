<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Camera to inference pipeline</title><desc id="d">Camera frames pass through the ISP and VIC in hardware, then inference on DLA or GPU, with the CPU only handling control and small tensors.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="220" rx="14" fill="#120d1c"/><text x="320" y="24" font-size="15" fill="#b26bff" text-anchor="middle" font-weight="700" >Keep frames in hardware memory</text><rect x="12" y="48" width="114" height="70" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="69.0" y="80.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Camera</text><text x="69.0" y="97.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >MIPI CSI-2</text><line x1="127" y1="83" x2="137" y2="83" stroke="#4fa8ff" stroke-width="1.8" marker-end="url(#ah)"/><rect x="138" y="48" width="114" height="70" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="195.0" y="80.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >ISP</text><text x="195.0" y="97.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >Argus</text><line x1="253" y1="83" x2="263" y2="83" stroke="#e3b341" stroke-width="1.8" marker-end="url(#ah)"/><rect x="264" y="48" width="114" height="70" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="321.0" y="80.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >VIC</text><text x="321.0" y="97.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >resize + color</text><line x1="379" y1="83" x2="389" y2="83" stroke="#e3b341" stroke-width="1.8" marker-end="url(#ah)"/><rect x="390" y="48" width="114" height="70" rx="10" fill="#1c1530" stroke="#e06aa8" stroke-width="1.5"/><text x="447.0" y="80.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >DLA / GPU</text><text x="447.0" y="97.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >TensorRT</text><line x1="505" y1="83" x2="515" y2="83" stroke="#e06aa8" stroke-width="1.8" marker-end="url(#ah)"/><rect x="516" y="48" width="114" height="70" rx="10" fill="#1c1530" stroke="#76b900" stroke-width="1.5"/><text x="573.0" y="80.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >CPU</text><text x="573.0" y="97.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >control, small tensors</text><line x1="296" y1="118" x2="296" y2="158" stroke="#e3b341" stroke-width="1.8" marker-end="url(#ah)"/><rect x="222" y="160" width="148" height="44" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="296.0" y="179.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >NVENC</text><text x="296.0" y="196.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >H.264 / H.265 file</text><text x="500" y="150" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >NVMM memory: frames stay in</text><text x="500" y="166" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >hardware buffers between stages</text><text x="500" y="190" font-size="11" fill="#76b900" text-anchor="middle" font-weight="600" >Scale before the CPU copy.</text></svg>
