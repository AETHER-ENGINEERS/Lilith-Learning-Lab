<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Transformer</title><desc id="d">Two coils on an iron core. The voltage ratio equals the turns ratio.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="250" rx="14" fill="#120d1c"/><text x="320" y="22" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >A transformer: Vs / Vp = Ns / Np</text><rect x="250" y="60" width="140" height="130" rx="6" fill="none" stroke="#a99dc7" stroke-width="10" opacity="0.55"/><path d="M245,80 a10,9 0 1,1 0,18" fill="none" stroke="#e3b341" stroke-width="2.6"/><path d="M245,98 a10,9 0 1,1 0,18" fill="none" stroke="#e3b341" stroke-width="2.6"/><path d="M245,116 a10,9 0 1,1 0,18" fill="none" stroke="#e3b341" stroke-width="2.6"/><path d="M245,134 a10,9 0 1,1 0,18" fill="none" stroke="#e3b341" stroke-width="2.6"/><path d="M245,152 a10,9 0 1,1 0,18" fill="none" stroke="#e3b341" stroke-width="2.6"/><path d="M245,170 a10,9 0 1,1 0,18" fill="none" stroke="#e3b341" stroke-width="2.6"/><text x="214" y="135" font-size="14" fill="#e3b341" text-anchor="middle" font-weight="400" >Np</text><path d="M395,80 a10,9 0 1,1 0,18" fill="none" stroke="#76b900" stroke-width="2.6"/><path d="M395,98 a10,9 0 1,1 0,18" fill="none" stroke="#76b900" stroke-width="2.6"/><path d="M395,116 a10,9 0 1,1 0,18" fill="none" stroke="#76b900" stroke-width="2.6"/><path d="M395,134 a10,9 0 1,1 0,18" fill="none" stroke="#76b900" stroke-width="2.6"/><path d="M395,152 a10,9 0 1,1 0,18" fill="none" stroke="#76b900" stroke-width="2.6"/><path d="M395,170 a10,9 0 1,1 0,18" fill="none" stroke="#76b900" stroke-width="2.6"/><text x="426" y="135" font-size="14" fill="#76b900" text-anchor="middle" font-weight="400" >Ns</text><polyline points="100,70 245,70" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="100,190 245,190" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="100,70 100,190" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="395,70 540,70" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="395,190 540,190" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="540,70 540,190" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="70" y="135" font-size="14" fill="#e3b341" text-anchor="middle" font-weight="400" >Vp</text><text x="570" y="135" font-size="14" fill="#76b900" text-anchor="middle" font-weight="400" >Vs</text><text x="320" y="228" font-size="11.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >Few turns on the output: step down. More turns: step up. Only AC passes.</text></svg>
