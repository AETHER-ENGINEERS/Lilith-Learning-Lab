<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Inverting op-amp</title><desc id="d">An op-amp with a feedback resistor Rf and an input resistor Rin. The gain is minus Rf over Rin.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="270" rx="14" fill="#120d1c"/><text x="320" y="22" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >Feedback sets the gain</text><polygon points="260,80 260,190 360,135" fill="#2a1f45" stroke="#b26bff" stroke-width="2.4"/><text x="272" y="112" font-size="18" fill="#efe9ff" text-anchor="middle" font-weight="400" >-</text><text x="272" y="168" font-size="18" fill="#efe9ff" text-anchor="middle" font-weight="400" >+</text><polyline points="40,108 80,108" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="80,108 90,108 95.83333333333333,116 107.5,100 119.16666666666666,116 130.83333333333331,100 142.5,116 154.16666666666666,100 160,108 170,108" fill="none" stroke="#e3b341" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="170,108 260,108" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="125" y="92" font-size="13" fill="#e3b341" text-anchor="middle" font-weight="400" >Rin</text><text x="30" y="112" font-size="13" fill="#efe9ff" text-anchor="end" font-weight="400" >Vin</text><polyline points="360,135 460,135" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="470" y="139" font-size="13" fill="#efe9ff" text-anchor="start" font-weight="400" >Vout</text><polyline points="215,108 215,50 410,50 410,135" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="215" cy="108" r="3.5" fill="#efe9ff"/><circle cx="410" cy="135" r="3.5" fill="#efe9ff"/><polyline points="270,50 280,50 285.0,58 295.0,42 305.0,58 315.0,42 325.0,58 335.0,42 340,50 350,50" fill="none" stroke="#76b900" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="38" font-size="13" fill="#76b900" text-anchor="middle" font-weight="400" >Rf</text><polyline points="260,162 230,162 230,200" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="230,200 230,208" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="216" y1="208" x2="244" y2="208" stroke="#efe9ff" stroke-width="2.2"/><line x1="221" y1="213" x2="239" y2="213" stroke="#efe9ff" stroke-width="2.2"/><line x1="226" y1="218" x2="234" y2="218" stroke="#efe9ff" stroke-width="2.2"/><text x="500" y="100" font-size="14" fill="#efe9ff" text-anchor="start" font-weight="700" >gain = -Rf / Rin</text><text x="500" y="124" font-size="11.5" fill="#a99dc7" text-anchor="start" font-weight="400" >Rf = 100k, Rin = 10k:</text><text x="500" y="144" font-size="13" fill="#e3b341" text-anchor="start" font-weight="600" >gain = -10</text></svg>
