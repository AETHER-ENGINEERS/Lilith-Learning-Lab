<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Kirchhoff's laws</title><desc id="d">Left: voltages around a loop add to zero. Right: currents into a node add to zero.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="270" rx="14" fill="#120d1c"/><text x="160" y="24" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >Loop: the voltages add to zero</text><text x="480" y="24" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >Node: the currents add to zero</text><rect x="60" y="50" width="200" height="160" rx="4" fill="none" stroke="#efe9ff" stroke-width="2"/><rect x="143" y="39" width="34" height="22" rx="6" fill="#2a1f45" stroke="#b26bff"/><text x="160" y="55" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="400" >v1</text><rect x="243" y="119" width="34" height="22" rx="6" fill="#2a1f45" stroke="#b26bff"/><text x="260" y="135" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="400" >v2</text><rect x="143" y="199" width="34" height="22" rx="6" fill="#2a1f45" stroke="#b26bff"/><text x="160" y="215" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="400" >v3</text><rect x="43" y="119" width="34" height="22" rx="6" fill="#2a1f45" stroke="#b26bff"/><text x="60" y="135" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="400" >v4</text><text x="160" y="240" font-size="14" fill="#efe9ff" text-anchor="middle" font-weight="700" >v1 + v2 + v3 + v4 = 0</text><circle cx="480" cy="120" r="6" fill="#e3b341"/><line x1="400" y1="70" x2="474" y2="120" stroke="#efe9ff" stroke-width="1.8" marker-end="url(#ah)"/><text x="394" y="62" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="400" >i1</text><line x1="400" y1="170" x2="474" y2="120" stroke="#efe9ff" stroke-width="1.8" marker-end="url(#ah)"/><text x="394" y="162" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="400" >i2</text><line x1="486" y1="120" x2="570" y2="120" stroke="#efe9ff" stroke-width="1.8" marker-end="url(#ah)"/><text x="576" y="112" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="400" >i3</text><text x="480" y="240" font-size="14" fill="#efe9ff" text-anchor="middle" font-weight="700" >i1 + i2 = i3</text><text x="480" y="258" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >(in = out)</text></svg>
