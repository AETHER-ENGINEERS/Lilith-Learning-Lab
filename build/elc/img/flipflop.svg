<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">D flip-flop timing</title><desc id="d">A timing diagram of a D flip-flop: Q copies D only on rising clock edges.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="250" rx="14" fill="#120d1c"/><text x="320" y="20" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >D flip-flop: Q copies D on the rising clock edge</text><text x="40" y="84" font-size="13" fill="#efe9ff" text-anchor="end" font-weight="400" >CLK</text><polyline points="60,90 130,90 130,90 130,60 200,60 200,60 200,90 270,90 270,90 270,60 340,60 340,60 340,90 410,90 410,90 410,60 480,60 480,60 480,90 550,90 550,90 550,60 620,60" fill="none" stroke="#4fa8ff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="40" y="144" font-size="13" fill="#efe9ff" text-anchor="end" font-weight="400" >D</text><polyline points="60,120 130,120 130,120 130,120 200,120 200,120 200,150 270,150 270,150 270,150 340,150 340,150 340,120 410,120 410,120 410,120 480,120 480,120 480,150 550,150 550,150 550,150 620,150" fill="none" stroke="#e3b341" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="40" y="204" font-size="13" fill="#efe9ff" text-anchor="end" font-weight="400" >Q</text><polyline points="60,210 130,210 130,210 130,180 200,180 200,180 200,180 270,180 270,180 270,210 340,210 340,210 340,210 410,210 410,210 410,180 480,180 480,180 480,180 550,180 550,180 550,210 620,210" fill="none" stroke="#76b900" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="130" y1="50" x2="130" y2="215" stroke="#a99dc7" stroke-width="1" stroke-dasharray="3,4"/><line x1="270" y1="50" x2="270" y2="215" stroke="#a99dc7" stroke-width="1" stroke-dasharray="3,4"/><line x1="410" y1="50" x2="410" y2="215" stroke="#a99dc7" stroke-width="1" stroke-dasharray="3,4"/><line x1="550" y1="50" x2="550" y2="215" stroke="#a99dc7" stroke-width="1" stroke-dasharray="3,4"/><text x="320" y="238" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >Dotted lines: rising edges, when the flip-flop looks at D.</text></svg>
