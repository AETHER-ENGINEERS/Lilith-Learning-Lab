<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">LED on an Arduino pin</title><desc id="d">Pin 13 connects through a 220 ohm resistor to an LED and then to ground.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="260" rx="14" fill="#120d1c"/><text x="320" y="22" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >Blink: pin 13 to resistor to LED to GND</text><rect x="30" y="60" width="120" height="140" rx="10" fill="#0f6a6a" stroke="#064" stroke-width="2"/><text x="90" y="120" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="700" >Arduino</text><text x="90" y="140" font-size="12" fill="#efe9ff" text-anchor="middle" font-weight="400" >Uno</text><polyline points="150,90 200,90" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="80" font-size="10.5" fill="#efe9ff" text-anchor="start" font-weight="400" >pin 13</text><polyline points="200,90 210,90 216.66666666666666,98 230.0,82 243.33333333333334,98 256.6666666666667,82 270.0,98 283.33333333333337,82 290,90 300,90" fill="none" stroke="#e3b341" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="250" y="72" font-size="11.5" fill="#e3b341" text-anchor="middle" font-weight="400" >220 ohm</text><polyline points="300,90 380,90" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="380,78 380,102 404,90" fill="none" stroke="#e06aa8" stroke-width="2.4"/><line x1="404" y1="78" x2="404" y2="102" stroke="#e06aa8" stroke-width="3"/><line x1="400" y1="68" x2="424" y2="50" stroke="#e3b341" stroke-width="1.8" marker-end="url(#ah)"/><line x1="412" y1="76" x2="436" y2="58" stroke="#e3b341" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="404,90 470,90 470,200 150,200" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="216" font-size="10.5" fill="#efe9ff" text-anchor="start" font-weight="400" >GND</text><text x="330" y="150" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >digitalWrite(13, HIGH) puts 5 V on the pin</text><text x="330" y="170" font-size="11.5" fill="#e3b341" text-anchor="middle" font-weight="400" >Current = (5 - 2) / 220 = about 14 mA</text><text x="330" y="190" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >(an Uno pin can give about 20 mA)</text></svg>
