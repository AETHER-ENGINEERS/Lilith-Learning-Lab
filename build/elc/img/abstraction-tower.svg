<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Layers of abstraction</title><desc id="d">From physics up to software: each layer hides the details of the one below it.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="372" rx="14" fill="#120d1c"/><text x="320" y="24" font-size="15" fill="#b26bff" text-anchor="middle" font-weight="700" >Each layer hides the one below</text><rect x="40.0" y="40" width="560" height="40" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="320.0" y="57.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Software and systems</text><text x="320.0" y="74.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >operating systems, apps</text><rect x="51.0" y="87" width="538" height="40" rx="10" fill="#1c1530" stroke="#4fa8ff" stroke-width="1.5"/><text x="320.0" y="104.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Processors</text><text x="320.0" y="121.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >instruction set abstraction</text><rect x="62.0" y="134" width="516" height="40" rx="10" fill="#1c1530" stroke="#76b900" stroke-width="1.5"/><text x="320.0" y="151.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Digital logic</text><text x="320.0" y="168.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >gates, flip-flops, clocks</text><rect x="73.0" y="181" width="494" height="40" rx="10" fill="#1c1530" stroke="#e3b341" stroke-width="1.5"/><text x="320.0" y="198.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Amplifiers and gates</text><text x="320.0" y="215.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >op-amp and digital abstractions</text><rect x="84.0" y="228" width="472" height="40" rx="10" fill="#1c1530" stroke="#e06aa8" stroke-width="1.5"/><text x="320.0" y="245.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Lumped circuits</text><text x="320.0" y="262.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >R, C, L, sources: just algebra</text><rect x="95.0" y="275" width="450" height="40" rx="10" fill="#1c1530" stroke="#b26bff" stroke-width="1.5"/><text x="320.0" y="292.0" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="600" >Physics</text><text x="320.0" y="309.0" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >Maxwell's equations, electrons</text><text x="22" y="362" font-size="11" fill="#a99dc7">This course lives in the middle: from lumped circuits up to gates and amplifiers.</text></svg>
