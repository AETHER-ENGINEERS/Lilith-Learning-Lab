<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Logic gate symbols</title><desc id="d">Symbols and truth tables for AND, OR, NOT, NAND and XOR gates.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="300" rx="14" fill="#120d1c"/><text x="320" y="20" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >Logic gates</text><path d="M30,90 h26 a26,26 0 0,1 0,52 h-26 z" fill="#2a1f45" stroke="#b26bff" stroke-width="2.2"/><text x="60" y="78" font-size="14" fill="#efe9ff" text-anchor="middle" font-weight="700" >AND</text><text x="60" y="180" font-size="11" fill="#e3b341" text-anchor="middle" font-weight="400" >out: 0 0 0 1</text><text x="60" y="200" font-size="10" fill="#a99dc7" text-anchor="middle" font-weight="400" >inputs 00 01 10 11</text><path d="M152,90 q12,26 0,52 q38,0 54,-26 q-16,-26 -54,-26 z" fill="#2a1f45" stroke="#b26bff" stroke-width="2.2"/><text x="182" y="78" font-size="14" fill="#efe9ff" text-anchor="middle" font-weight="700" >OR</text><text x="182" y="180" font-size="11" fill="#e3b341" text-anchor="middle" font-weight="400" >out: 0 1 1 1</text><text x="182" y="200" font-size="10" fill="#a99dc7" text-anchor="middle" font-weight="400" >inputs 00 01 10 11</text><polygon points="274,90 274,142 318,116" fill="#2a1f45" stroke="#b26bff" stroke-width="2.2"/><circle cx="323" cy="116" r="5" fill="#120d1c" stroke="#b26bff" stroke-width="2"/><text x="304" y="78" font-size="14" fill="#efe9ff" text-anchor="middle" font-weight="700" >NOT</text><text x="304" y="180" font-size="11" fill="#e3b341" text-anchor="middle" font-weight="400" >in 0,1 -&gt; 1 0</text><text x="304" y="200" font-size="10" fill="#a99dc7" text-anchor="middle" font-weight="400" ></text><path d="M396,90 h26 a26,26 0 0,1 0,52 h-26 z" fill="#2a1f45" stroke="#b26bff" stroke-width="2.2"/><circle cx="450" cy="116" r="5" fill="#120d1c" stroke="#b26bff" stroke-width="2"/><text x="426" y="78" font-size="14" fill="#efe9ff" text-anchor="middle" font-weight="700" >NAND</text><text x="426" y="180" font-size="11" fill="#e3b341" text-anchor="middle" font-weight="400" >out: 1 1 1 0</text><text x="426" y="200" font-size="10" fill="#a99dc7" text-anchor="middle" font-weight="400" >inputs 00 01 10 11</text><path d="M518,90 q12,26 0,52 q38,0 54,-26 q-16,-26 -54,-26 z" fill="#2a1f45" stroke="#b26bff" stroke-width="2.2"/><path d="M511,90 q12,26 0,52" fill="none" stroke="#b26bff" stroke-width="2.2"/><text x="548" y="78" font-size="14" fill="#efe9ff" text-anchor="middle" font-weight="700" >XOR</text><text x="548" y="180" font-size="11" fill="#e3b341" text-anchor="middle" font-weight="400" >out: 0 1 1 0</text><text x="548" y="200" font-size="10" fill="#a99dc7" text-anchor="middle" font-weight="400" >inputs 00 01 10 11</text><text x="320" y="270" font-size="12" fill="#a99dc7" text-anchor="middle" font-weight="400" >NAND is universal: every other gate can be built from NAND gates alone.</text></svg>
