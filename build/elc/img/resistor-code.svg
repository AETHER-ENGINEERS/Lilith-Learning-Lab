<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Resistor color code</title><desc id="d">A resistor with brown, black, red and gold bands, which means 1000 ohms with 5 percent tolerance, and the digit table.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="280" rx="14" fill="#120d1c"/><text x="320" y="24" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >Brown, black, red, gold = 10 x 100 = 1000 ohms, 5 percent</text><polyline points="40,80 100,80" fill="none" stroke="#efe9ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="440,80 500,80" fill="none" stroke="#efe9ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="100" y="55" width="340" height="50" rx="22" fill="#c9a66b" stroke="#8d7040" stroke-width="2"/><rect x="140" y="55" width="16" height="50" fill="#6b3b12"/><rect x="190" y="55" width="16" height="50" fill="#111"/><rect x="240" y="55" width="16" height="50" fill="#d33"/><rect x="380" y="55" width="16" height="50" fill="#d4af37"/><text x="148" y="130" font-size="12" fill="#efe9ff" text-anchor="middle" font-weight="400" >1</text><text x="198" y="130" font-size="12" fill="#efe9ff" text-anchor="middle" font-weight="400" >0</text><text x="248" y="130" font-size="12" fill="#efe9ff" text-anchor="middle" font-weight="400" >x100</text><text x="388" y="130" font-size="12" fill="#efe9ff" text-anchor="middle" font-weight="400" >5%</text><rect x="40" y="170" width="46" height="34" rx="6" fill="#111" stroke="#3d2f5c"/><text x="63" y="226" font-size="15" fill="#efe9ff" text-anchor="middle" font-weight="700" >0</text><text x="63" y="244" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >black</text><rect x="98" y="170" width="46" height="34" rx="6" fill="#6b3b12" stroke="#3d2f5c"/><text x="121" y="226" font-size="15" fill="#efe9ff" text-anchor="middle" font-weight="700" >1</text><text x="121" y="244" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >brown</text><rect x="156" y="170" width="46" height="34" rx="6" fill="#d33" stroke="#3d2f5c"/><text x="179" y="226" font-size="15" fill="#efe9ff" text-anchor="middle" font-weight="700" >2</text><text x="179" y="244" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >red</text><rect x="214" y="170" width="46" height="34" rx="6" fill="#f80" stroke="#3d2f5c"/><text x="237" y="226" font-size="15" fill="#efe9ff" text-anchor="middle" font-weight="700" >3</text><text x="237" y="244" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >orange</text><rect x="272" y="170" width="46" height="34" rx="6" fill="#ee3" stroke="#3d2f5c"/><text x="295" y="226" font-size="15" fill="#efe9ff" text-anchor="middle" font-weight="700" >4</text><text x="295" y="244" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >yellow</text><rect x="330" y="170" width="46" height="34" rx="6" fill="#3a3" stroke="#3d2f5c"/><text x="353" y="226" font-size="15" fill="#efe9ff" text-anchor="middle" font-weight="700" >5</text><text x="353" y="244" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >green</text><rect x="388" y="170" width="46" height="34" rx="6" fill="#35e" stroke="#3d2f5c"/><text x="411" y="226" font-size="15" fill="#efe9ff" text-anchor="middle" font-weight="700" >6</text><text x="411" y="244" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >blue</text><rect x="446" y="170" width="46" height="34" rx="6" fill="#93c" stroke="#3d2f5c"/><text x="469" y="226" font-size="15" fill="#efe9ff" text-anchor="middle" font-weight="700" >7</text><text x="469" y="244" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >violet</text><rect x="504" y="170" width="46" height="34" rx="6" fill="#999" stroke="#3d2f5c"/><text x="527" y="226" font-size="15" fill="#efe9ff" text-anchor="middle" font-weight="700" >8</text><text x="527" y="244" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >gray</text><rect x="562" y="170" width="46" height="34" rx="6" fill="#fff" stroke="#3d2f5c"/><text x="585" y="226" font-size="15" fill="#efe9ff" text-anchor="middle" font-weight="700" >9</text><text x="585" y="244" font-size="10.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >white</text><text x="320" y="268" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >Gold = 5 percent, silver = 10 percent. The third band is the multiplier (number of zeros).</text></svg>
