<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">555 astable circuit</title><desc id="d">A 555 timer with resistors R1 and R2 and a capacitor C making a free-running oscillator.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="300" rx="14" fill="#120d1c"/><text x="320" y="22" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >555 astable oscillator</text><rect x="230" y="60" width="140" height="170" rx="8" fill="#2a1f45" stroke="#b26bff" stroke-width="2.2"/><text x="300" y="150" font-size="22" fill="#efe9ff" text-anchor="middle" font-weight="700" >555</text><text x="240" y="214" font-size="9.5" fill="#a99dc7" text-anchor="start" font-weight="400" >1 GND</text><text x="240" y="184" font-size="9.5" fill="#a99dc7" text-anchor="start" font-weight="400" >2 TRIG</text><text x="360" y="154" font-size="9.5" fill="#a99dc7" text-anchor="end" font-weight="400" >3 OUT</text><text x="240" y="94" font-size="9.5" fill="#a99dc7" text-anchor="start" font-weight="400" >4 RST</text><text x="360" y="204" font-size="9.5" fill="#a99dc7" text-anchor="end" font-weight="400" >5 CTRL</text><text x="240" y="154" font-size="9.5" fill="#a99dc7" text-anchor="start" font-weight="400" >6 THR</text><text x="240" y="124" font-size="9.5" fill="#a99dc7" text-anchor="start" font-weight="400" >7 DIS</text><text x="360" y="94" font-size="9.5" fill="#a99dc7" text-anchor="end" font-weight="400" >8 VCC</text><polyline points="100,60 400,60" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="80" y="64" font-size="12" fill="#ff6b6b" text-anchor="end" font-weight="400" >+V</text><polyline points="300,60 300,60" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="370,90 400,90 400,60" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="150,60 150,70 158,72.5 142,77.5 158,82.5 142,87.5 158,92.5 142,97.5 150,100 150,110" fill="none" stroke="#e3b341" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="150,110 150,120 230,120" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="172" y="90" font-size="12" fill="#e3b341" text-anchor="start" font-weight="400" >R1</text><polyline points="150,120 150,130 158,132.5 142,137.5 158,142.5 142,147.5 158,152.5 142,157.5 150,160 150,170" fill="none" stroke="#76b900" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="172" y="150" font-size="12" fill="#76b900" text-anchor="start" font-weight="400" >R2</text><polyline points="150,170 170,170" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="170,170 170,150 230,150" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="170,170 170,180 230,180" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="150,170 150,200" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="135" y1="200" x2="165" y2="200" stroke="#4fa8ff" stroke-width="3"/><line x1="135" y1="210" x2="165" y2="210" stroke="#4fa8ff" stroke-width="3"/><polyline points="150,210 150,240" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="150,240 150,248" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="136" y1="248" x2="164" y2="248" stroke="#efe9ff" stroke-width="2.2"/><line x1="141" y1="253" x2="159" y2="253" stroke="#efe9ff" stroke-width="2.2"/><line x1="146" y1="258" x2="154" y2="258" stroke="#efe9ff" stroke-width="2.2"/><text x="176" y="208" font-size="12" fill="#4fa8ff" text-anchor="start" font-weight="400" >C</text><polyline points="230,90 200,90 200,60" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="230,210 210,210 210,250" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="210,250 210,258" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="196" y1="258" x2="224" y2="258" stroke="#efe9ff" stroke-width="2.2"/><line x1="201" y1="263" x2="219" y2="263" stroke="#efe9ff" stroke-width="2.2"/><line x1="206" y1="268" x2="214" y2="268" stroke="#efe9ff" stroke-width="2.2"/><polyline points="370,150 440,150" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="450" y="154" font-size="12" fill="#efe9ff" text-anchor="start" font-weight="400" >out</text><text x="500" y="210" font-size="12" fill="#efe9ff" text-anchor="middle" font-weight="600" >f = 1.44 / ((R1 + 2 R2) C)</text><text x="500" y="230" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >duty = (R1 + R2) / (R1 + 2 R2)</text></svg>
