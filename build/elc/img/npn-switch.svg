<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Transistor as a switch</title><desc id="d">An NPN transistor with a base resistor switching a lamp. A small base current turns on the larger collector current.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="290" rx="14" fill="#120d1c"/><text x="320" y="22" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >A small base current switches a bigger load</text><polyline points="300,40 300,70" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="300" cy="40" r="3.5" fill="#ff6b6b"/><text x="320" y="44" font-size="13" fill="#efe9ff" text-anchor="start" font-weight="400" >+V</text><circle cx="300" cy="100" r="22" fill="#2a1f45" stroke="#e3b341" stroke-width="2.2"/><line x1="286" y1="86" x2="314" y2="114" stroke="#e3b341" stroke-width="2"/><line x1="314" y1="86" x2="286" y2="114" stroke="#e3b341" stroke-width="2"/><text x="334" y="104" font-size="12" fill="#a99dc7" text-anchor="start" font-weight="400" >lamp</text><polyline points="300,122 300,150 300,160" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="280" y1="160" x2="280" y2="220" stroke="#efe9ff" stroke-width="4"/><polyline points="280,175 300,160 300,150" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="280,205 300,220 300,245" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="298,214 288,206 296,204" fill="#efe9ff"/><text x="312" y="160" font-size="12" fill="#a99dc7" text-anchor="start" font-weight="400" >C</text><text x="312" y="232" font-size="12" fill="#a99dc7" text-anchor="start" font-weight="400" >E</text><text x="262" y="195" font-size="12" fill="#a99dc7" text-anchor="end" font-weight="400" >B</text><polyline points="70,190 100,190" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="100,190 110,190 115.83333333333333,198 127.5,182 139.16666666666666,198 150.83333333333331,182 162.5,198 174.16666666666666,182 180,190 190,190" fill="none" stroke="#e3b341" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="190,190 280,190" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="145" y="172" font-size="13" fill="#e3b341" text-anchor="middle" font-weight="400" >Rb</text><text x="70" y="182" font-size="12" fill="#efe9ff" text-anchor="end" font-weight="400" >input</text><polyline points="300,245 300,253" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="286" y1="253" x2="314" y2="253" stroke="#efe9ff" stroke-width="2.2"/><line x1="291" y1="258" x2="309" y2="258" stroke="#efe9ff" stroke-width="2.2"/><line x1="296" y1="263" x2="304" y2="263" stroke="#efe9ff" stroke-width="2.2"/><rect x="420" y="70" width="200" height="140" rx="12" fill="#1c1530" stroke="#3d2f5c"/><text x="520" y="100" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >Ic = beta x Ib</text><text x="520" y="124" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >drive hard: Ib about Ic/(beta/10)</text><text x="520" y="148" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >Rb = (Vin - 0.7) / Ib</text><text x="520" y="172" font-size="11.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >Vce falls to a few tenths</text><text x="520" y="196" font-size="11.5" fill="#a99dc7" text-anchor="middle" font-weight="400" >of a volt when saturated</text></svg>
