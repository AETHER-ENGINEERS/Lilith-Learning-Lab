e-linejoin="round" stroke-linecap="round"/><line x1="40" y1="220.0" x2="440" y2="220.0" stroke="#e3b341" stroke-width="1.2" stroke-dasharray="5,4"/><text x="450" y="236" font-size="11" fill="#efe9ff" text-anchor="start" font-weight="400" >analogWrite(9, 191)  75%  avg 3.75 V</text></svg>
