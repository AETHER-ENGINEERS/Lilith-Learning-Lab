<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">A bulb replaced by a resistor</title><desc id="d">On the left a light bulb with a filament between terminals A and B; on the right the same bulb drawn as a resistor R with voltage V and current I.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="250" rx="14" fill="#120d1c"/><text x="160" y="26" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >The real object</text><text x="480" y="26" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >The lumped abstraction</text><circle cx="160" cy="110" r="52" fill="#2a1f45" stroke="#efe9ff" stroke-width="2.2"/><polyline points="135,160 135,118 148,100 160,120 172,100 185,118 185,160" fill="none" stroke="#e3b341" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="135" y1="160" x2="135" y2="190" stroke="#efe9ff" stroke-width="2.4"/><line x1="185" y1="160" x2="185" y2="190" stroke="#efe9ff" stroke-width="2.4"/><text x="135" y="208" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="400" >A</text><text x="185" y="208" font-size="13" fill="#efe9ff" text-anchor="middle" font-weight="400" >B</text><text x="160" y="236" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >shape, heat, light, color...</text><line x1="250" y1="120" x2="370" y2="120" stroke="#b26bff" stroke-width="1.8" marker-end="url(#ah)"/><text x="310" y="108" font-size="11" fill="#a99dc7" text-anchor="middle" font-weight="400" >ignore all but V and I</text><polyline points="480,70 480,80" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="480,80 480,90 488,96.66666666666667 472,110.0 488,123.33333333333334 472,136.66666666666669 488,150.0 472,163.33333333333334 480,170 480,180" fill="none" stroke="#e3b341" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="480,180 480,196" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="480" cy="70" r="3.5" fill="#efe9ff"/><circle cx="480" cy="196" r="3.5" fill="#efe9ff"/><text x="462" y="70" font-size="13" fill="#efe9ff" text-anchor="end" font-weight="400" >A</text><text x="462" y="200" font-size="13" fill="#efe9ff" text-anchor="end" font-weight="400" >B</text><text x="500" y="135" font-size="15" fill="#e3b341" text-anchor="start" font-weight="700" >R</text><text x="540" y="100" font-size="15" fill="#efe9ff" text-anchor="start" font-weight="700" >I = V / R</text><text x="540" y="124" font-size="11" fill="#a99dc7" text-anchor="start" font-weight="400" >only the v-i</text><text x="540" y="138" font-size="11" fill="#a99dc7" text-anchor="start" font-weight="400" >relationship is kept</text></svg>
