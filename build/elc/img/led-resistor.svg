<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">LED with a series resistor</title><desc id="d">A battery, a resistor and an LED in a loop. The resistor value is (supply minus LED voltage) divided by the current.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="250" rx="14" fill="#120d1c"/><text x="320" y="22" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >An LED always needs a resistor</text><polyline points="60,50 60,117.0" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="60,133.0 60,200" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="44" y1="117.0" x2="76" y2="117.0" stroke="#ff6b6b" stroke-width="3"/><line x1="51" y1="133.0" x2="69" y2="133.0" stroke="#ff6b6b" stroke-width="3"/><text x="36" y="113.0" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="700" >+</text><text x="88" y="129.0" font-size="13" fill="#efe9ff" text-anchor="start" font-weight="400" >9 V</text><polyline points="60,50 110,50" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="110,50 120,50 127.5,58 142.5,42 157.5,58 172.5,42 187.5,58 202.5,42 210,50 220,50" fill="none" stroke="#e3b341" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="220,50 300,50" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="288,70 312,70 300,95" fill="none" stroke="#e06aa8" stroke-width="2.4"/><line x1="288" y1="95" x2="312" y2="95" stroke="#e06aa8" stroke-width="3"/><polyline points="300,50 300,70" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="300,95 300,200 60,200" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="320" y1="60" x2="352" y2="42" stroke="#e3b341" stroke-width="1.8" marker-end="url(#ah)"/><line x1="328" y1="80" x2="360" y2="62" stroke="#e3b341" stroke-width="1.8" marker-end="url(#ah)"/><text x="165" y="36" font-size="14" fill="#e3b341" text-anchor="middle" font-weight="400" >R</text><text x="430" y="90" font-size="15" fill="#efe9ff" text-anchor="start" font-weight="700" >R = (Vs - Vf) / I</text><text x="430" y="116" font-size="13" fill="#a99dc7" text-anchor="start" font-weight="400" >= (9 - 2) / 0.015</text><text x="430" y="140" font-size="13" fill="#e3b341" text-anchor="start" font-weight="600" >= 467 ohms, use 470</text></svg>
