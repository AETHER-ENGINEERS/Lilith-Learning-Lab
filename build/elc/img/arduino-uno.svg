<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Arduino Uno layout</title><desc id="d">A simplified Arduino Uno showing the USB socket, the power header, digital pins 0 to 13 with PWM pins marked, and analog pins A0 to A5.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="340" rx="14" fill="#120d1c"/><text x="320" y="20" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >Arduino Uno: where the pins are</text><rect x="60" y="40" width="520" height="270" rx="14" fill="#0f6a6a" stroke="#064" stroke-width="2"/><rect x="60" y="90" width="60" height="70" rx="4" fill="#9aa" stroke="#566" stroke-width="1.5"/><text x="90" y="130" font-size="11" fill="#123" text-anchor="middle" font-weight="400" >USB</text><rect x="60" y="210" width="50" height="60" rx="4" fill="#111" stroke="#555" stroke-width="1.5"/><text x="85" y="245" font-size="10" fill="#efe9ff" text-anchor="middle" font-weight="400" >DC in</text><rect x="300" y="150" width="100" height="110" rx="4" fill="#222" stroke="#555" stroke-width="1.5"/><text x="350" y="200" font-size="11" fill="#efe9ff" text-anchor="middle" font-weight="400" >ATmega328P</text><text x="350" y="216" font-size="10" fill="#a99dc7" text-anchor="middle" font-weight="400" >5 V, 16 MHz</text><text x="320" y="66" font-size="11" fill="#efe9ff" text-anchor="middle" font-weight="400" >Digital pins (~ = PWM)</text><rect x="172" y="72" width="16" height="20" fill="#111" stroke="#777"/><text x="180" y="106" font-size="10.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >0</text><rect x="200" y="72" width="16" height="20" fill="#111" stroke="#777"/><text x="208" y="106" font-size="10.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >1</text>