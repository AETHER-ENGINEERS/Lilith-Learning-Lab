<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Reading a light sensor</title><desc id="d">A photoresistor and a fixed resistor form a voltage divider between 5 volts and ground, with the middle point wired to analog pin A0.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="270" rx="14" fill="#120d1c"/><text x="320" y="22" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >analogRead(A0) reads the divider</text><polyline points="160,50 160,60" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="160" cy="50" r="3.5" fill="#ff6b6b"/><text x="180" y="54" font-size="13" fill="#efe9ff" text-anchor="start" font-weight="400" >5V</text><polyline points="160,60 160,70 168,74.16666666666667 152,82.5 168,90.83333333333334 152,99.16666666666667 168,107.5 152,115.83333333333334 160,120 160,130" fill="none" stroke="#e3b341" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="184" y="100" font-size="12" fill="#e3b341" text-anchor="start" font-weight="400" >LDR</text><polyline points="160,130 160,140" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="160" cy="140" r="5" fill="#76b900"/><polyline points="160,140 260,140" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="272" y="144" font-size="12" fill="#76b900" text-anchor="start" font-weight="400" >to A0</text><polyline points="160,140 160,150 168,154.16666666666666 152,162.5 168,170.83333333333334 152,179.16666666666666 168,187.5 152,195.83333333333334 160,200 160,210" fill="none" stroke="#76b900" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="184" y="180" font-size="12" fill="#76b900" text-anchor="start" font-weight="400" >10k</text><polyline points="160,210 160,218" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="146" y1="218" x2="174" y2="218" stroke="#efe9ff" stroke-width="2.2"/><line x1="151" y1="223" x2="169" y2="223" stroke="#efe9ff" stroke-width="2.2"/><line x1="156" y1="228" x2="164" y2="228" stroke="#efe9ff" stroke-width="2.2"/><line x1="110" y1="70" x2="140" y2="90" stroke="#e3b341" stroke-width="1.8" marker-end="url(#ah)"/><line x1="104" y1="90" x2="134" y2="108" stroke="#e3b341" stroke-width="1.8" marker-end="url(#ah)"/><rect x="380" y="60" width="230" height="150" rx="12" fill="#1c1530" stroke="#3d2f5c"/><text x="495" y="90" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >Bright: LDR small</text><text x="495" y="118" font-size="11.5" fill="#e3b341" text-anchor="middle" font-weight="400" >A0 voltage high, value near 1023</text><text x="495" y="146" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >Dark: LDR large</text><text x="495" y="174" font-size="11.5" fill="#e3b341" text-anchor="middle" font-weight="400" >A0 voltage low, value near 0</text><text x="495" y="202" font-size="11.5" fill="#efe9ff" text-anchor="middle" font-weight="400" >value = volts / 5 x 1023</text></svg>
