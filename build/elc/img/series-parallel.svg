<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Series and parallel</title><desc id="d">Two circuits with a battery: two resistors in series, and two resistors in parallel.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="250" rx="14" fill="#120d1c"/><text x="160" y="22" font-size="13" fill="#b26bff" text-anchor="middle" font-weight="700" >Series: one path, same current</text><text x="480" y="22" font-size="13" fill="#b26bff" text-anchor="middle" font-weight="700" >Parallel: same voltage, two paths</text><polyline points="50,60 50,122.0" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="50,138.0 50,200" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="34" y1="122.0" x2="66" y2="122.0" stroke="#ff6b6b" stroke-width="3"/><line x1="41" y1="138.0" x2="59" y2="138.0" stroke="#ff6b6b" stroke-width="3"/><text x="26" y="118.0" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="700" >+</text><text x="78" y="134.0" font-size="13" fill="#efe9ff" text-anchor="start" font-weight="400" >V</text><polyline points="50,60 130,60" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="130,60 140,60 144.16666666666666,68 152.5,52 160.83333333333334,68 169.16666666666666,52 177.5,68 185.83333333333334,52 190,60 200,60" fill="none" stroke="#e3b341" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="200,60 240,60 240,80" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="240,80 240,90 248,95.0 232,105.0 248,115.0 232,125.0 248,135.0 232,145.0 240,150 240,160" fill="none" stroke="#76b900" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="240,160 240,200 50,200" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="165" y="48" font-size="13" fill="#e3b341" text-anchor="middle" font-weight="400" >R1</text><text x="262" y="125" font-size="13" fill="#76b900" text-anchor="start" font-weight="400" >R2</text><text x="160" y="232" font-size="14" fill="#efe9ff" text-anchor="middle" font-weight="700" >R = R1 + R2</text><polyline points="380,60 380,122.0" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="380,138.0 380,200" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="364" y1="122.0" x2="396" y2="122.0" stroke="#ff6b6b" stroke-width="3"/><line x1="371" y1="138.0" x2="389" y2="138.0" stroke="#ff6b6b" stroke-width="3"/><text x="356" y="118.0" font-size="14" fill="#ff6b6b" text-anchor="middle" font-weight="700" >+</text><text x="408" y="134.0" font-size="13" fill="#efe9ff" text-anchor="start" font-weight="400" >V</text><polyline points="380,60 480,60" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="480,60 560,60" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="480,60 480,70 488,77.5 472,92.5 488,107.5 472,122.5 488,137.5 472,152.5 488,167.5 472,182.5 480,190 480,200" fill="none" stroke="#e3b341" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="560,60 560,70 568,77.5 552,92.5 568,107.5 552,122.5 568,137.5 552,152.5 568,167.5 552,182.5 560,190 560,200" fill="none" stroke="#76b900" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="480,200 560,200" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="