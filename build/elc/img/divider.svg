<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><title id="t">Voltage divider</title><desc id="d">Two resistors in series from Vin to ground with Vout taken from the junction.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99dc7"/></marker></defs><rect width="640" height="270" rx="14" fill="#120d1c"/><text x="320" y="24" font-size="14" fill="#b26bff" text-anchor="middle" font-weight="700" >Two resistors share the voltage</text><text x="130" y="55" font-size="14" fill="#efe9ff" text-anchor="middle" font-weight="400" >Vin</text><polyline points="130,70 130,80" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="130" cy="70" r="3.5" fill="#ff6b6b"/><polyline points="130,80 130,90 138,94.16666666666667 122,102.5 138,110.83333333333334 122,119.16666666666667 138,127.5 122,135.83333333333334 130,140 130,150" fill="none" stroke="#e3b341" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="152" y="120" font-size="14" fill="#e3b341" text-anchor="start" font-weight="400" >R1</text><polyline points="130,150 130,160" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="130" cy="155" r="3.5" fill="#efe9ff"/><polyline points="130,155 240,155" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="240" cy="155" r="5" fill="#76b900"/><text x="256" y="159" font-size="14" fill="#76b900" text-anchor="start" font-weight="400" >Vout</text><polyline points="130,160 130,170 138,174.16666666666666 122,182.5 138,190.83333333333334 122,199.16666666666666 138,207.5 122,215.83333333333334 130,220 130,230" fill="none" stroke="#76b900" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="152" y="200" font-size="14" fill="#76b900" text-anchor="start" font-weight="400" >R2</text><polyline points="130,230 130,238" fill="none" stroke="#efe9ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="116" y1="238" x2="144" y2="238" stroke="#efe9ff" stroke-width="2.2"/><line x1="121" y1="243" x2="139" y2="243" stroke="#efe9ff" stroke-width="2.2"/><line x1="126" y1="248" x2="134" y2="248" stroke="#efe9ff" stroke-width="2.2"/><rect x="340" y="70" width="270" height="150" rx="12" fill="#1c1530" stroke="#3d2f5c"/><text x="475" y="112" font-size="14" fill="#efe9ff" text-anchor="middle" font-weight="700" >Vout = Vin x R2 / (R1 + R2)</text><text x="475" y="142" font-size="12" fill="#a99dc7" text-anchor="middle" font-weight="400" >9 V, R1 = 1k, R2 = 2k</text><text x="475" y="164" font-size="13" fill="#e3b341" text-anchor="middle" font-weight="600" >Vout = 9 x 2000 / 3000 = 6 V</text><text x="475" y="198" font-size="12" fill="#a99dc7" text-anchor="middle" font-weight="400" >Load the output and it sags.</text></svg>
