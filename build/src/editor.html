<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lilith Course Editor</title>
<meta name="description" content="Write and edit Lilith Learning Lab courses in your browser: chapters, lessons, quizzes, flashcards, concept maps and practice labs. Free and offline.">
<meta name="theme-color" content="#120a22">
<style>
:root{--bg:#0f0b18;--panel:#1b1429;--panel2:#261b3b;--line:#3a2d55;--tx:#f1ebff;--dim:#a99dc7;--g:#b26bff;--g2:#d9acff;--pink:#e06aa8;--warn:#e3b341;--err:#ff7a9a;--ok:#7be0a4;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--g2)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
header .brand{font-weight:700;color:var(--g2);margin-right:auto;white-space:nowrap}
header .brand a{text-decoration:none}
button,.btn{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;min-height:34px}
button:hover{border-color:var(--g)}
button.pri{background:var(--g);color:#1b0a33;border-color:var(--g);font-weight:600}
button.sm{padding:3px 9px;min-height:28px;font-size:13px}
button.danger{color:var(--err)}
button:disabled{opacity:.45;cursor:default}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:0;min-height:calc(100% - 58px)}
aside,#issues{border-right:1px solid var(--line);padding:12px;overflow:auto;max-height:calc(100vh - 58px);position:sticky;top:58px}
#issues{border-right:0;border-left:1px solid var(--line)}
main{padding:14px 18px 80px;min-width:0}
.nav{display:block;width:100%;text-align:left;border-radius:10px;margin:3px 0;padding:7px 10px;background:transparent;border:1px solid transparent;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav.on{background:var(--panel2);border-color:var(--g)}
.nav .n{color:var(--dim);margin-right:6px}
.nav .bad{color:var(--err);margin-left:4px}
h2{margin:4px 0 12px;font-size:20px;color:var(--g2)}
h3{margin:0;font-size:16px}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;padding:0 12px}
details.sec>summary{cursor:pointer;padding:10px 0;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.sec>summary::before{content:'▸';color:var(--dim)}
details.sec[open]>summary::before{content:'▾'}
details.sec>summary .cnt{color:var(--dim);font-weight:400;font-size:13px}
details.sec>.body{padding:0 0 12px}
label.f{display:block;margin:8px 0;color:var(--dim);font-size:13px}
label.f>input,label.f>textarea,label.f>select{display:block;width:100%;margin-top:3px}
input,textarea,select{background:#0b0813;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px}
textarea{resize:vertical;min-height:60px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--g);outline-offset:-1px}
.item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.item .head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .head .t{font-weight:600;margin-right:auto;color:var(--g2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 2fr;gap:6px;align-items:start}
.muted{color:var(--dim);font-size:13px}
.hint{color:var(--dim);font-size:12.5px;margin:2px 0 6px}
.issue{font-size:13px;padding:6px 8px;border-radius:8px;margin:5px 0;background:var(--panel);border-left:3px solid var(--warn);cursor:pointer}
.issue.err{border-left-color:var(--err)}
.ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.stats{font-size:13px;color:var(--dim);margin:8px 0}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:16px;max-width:min(680px,94vw);width:100%;padding:16px}
dialog::backdrop{background:rgba(5,3,10,.7)}
.jerr{color:var(--err);font-size:12.5px}
.opt{display:flex;gap:6px;align-items:center;margin:4px 0}.opt input[type=text]{flex:1}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--g);border-radius:999px;padding:8px 16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.on{opacity:1}
@media (max-width:1100px){.layout{grid-template-columns:220px minmax(0,1fr)}#issues{grid-column:1/-1;position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:720px){header{position:static}.layout{display:block}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}#chlist{display:flex;gap:6px;overflow-x:auto}#chlist .nav{width:auto;flex:none;max-width:200px}main{padding:12px}.grid2{grid-template-columns:1fr}}
</style>
</head><body>
<header>
  <span class="brand"><a href="../">Lilith University</a> / Course editor</span>
  <button id="bNew">New</button><button id="bOpen">Open file</button><button id="bLib">From library</button><button id="bPaste">Paste JSON</button>
  <button id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
  <span id="vstat" class="badge">checking</span>
  <button id="bDown" class="pri">Download</button><button id="bTry" title="Open this course in the web app">Try in the app</button>
</header>
<div class="layout">
  <aside id="side"></aside>
  <main id="ed"></main>
  <section id="issues"></section>
</div>
<input type="file" id="fin" accept=".json,application/json" hidden>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
/*__COURSE__*/
</script>
<script>
(function () {
'use strict';
var K = window.LilithCourse;
var DRAFT = 'lilith.editor.draft', HANDOFF = 'lilith.handoff';
var RAW = 'https://raw.githubusercontent.com/lucky-edgelord/Lilith-Learning-Lab/main/courses/';
var LABS = ['fill', 'order', 'match', 'python', 'write', 'code', 'terminal', 'webxdc'];
var BLOCKS = ['text', 'code', 'math', 'figure', 'map'];
var MARK = 'ELI5.', OLDMARK = 'Explain it simply.', LEGACY = /^Teach it back\./;
var $ = function (s, r) { return (r || document).querySelector(s); };

/* ---------- state, autosave and undo ---------- */
function blank() {
  return { format: 'lilith-course', version: 1, id: 'my-course', title: 'My course', subtitle: '', author: '', description: '', category: '', level: 'Beginner', tags: [],
    chapters: [newChapter(1)] };
}
function newChapter(n) {
  return { title: 'Chapter ' + n, summary: [], glossary: [], keyPoints: [], lesson: [{ type: 'text', items: [] }], quiz: [], cards: [], maps: [], practice: [] };
}
function loadDraft() { try { var t = localStorage.getItem(DRAFT); if (t) { var j = JSON.parse(t); if (j && Array.isArray(j.chapters)) return j; } } catch (e) {} return null; }
var C = loadDraft() || blank(), sel = { kind: 'course' }, undo = [], last = JSON.stringify(C), saveT = null, valT = null, V = null;
function snapshot() { var now = JSON.stringify(C); if (now !== last) { undo.push(last); if (undo.length > 80) undo.shift(); last = now; } $('#bUndo').disabled = !undo.length; }
function persist() { try { localStorage.setItem(DRAFT, JSON.stringify(C)); } catch (e) { toast('Could not autosave (storage full?). Download your course to keep it.'); } }
/* typing: save and check after a pause; structure changes: save, check and redraw now */
function changed() { clearTimeout(saveT); saveT = setTimeout(function () { snapshot(); persist(); validate(); renderSide(); }, 400); }
function structural() { snapshot(); persist(); validate(); render(); }
function setCourse(j, msg) {
  if (!j || typeof j !== 'object' || Array.isArray(j)) throw new Error('A course must be a JSON object.');
  if (j.format && j.format !== 'lilith-course') throw new Error('This is not a Lilith course (format "' + j.format + '").');
  if (!Array.isArray(j.chapters)) j.chapters = [];
  snapshot(); C = j; sel = { kind: 'course' }; structural(); if (msg) toast(msg);
}
function toast(t) { var e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove('on'); }, 2600); }

/* ---------- small DOM helpers (user text only ever goes in as text or values) ---------- */
function h(tag, a) {
  var e = document.createElement(tag);
  if (a) for (var k in a) { if (k === 'text') e.textContent = a[k]; else if (k === 'cls') e.className = a[k]; else if (k.slice(0, 2) === 'on') e[k] = a[k]; else if (a[k] !== undefined && a[k] !== null && a[k] !== false) e.setAttribute(k, a[k] === true ? '' : a[k]); }
  for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c == null || c === false) continue; (Array.isArray(c) ? c : [c]).forEach(function (x) { if (x != null && x !== false) e.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); }); }
  return e;
}
function field(label, obj, key, o) {
  o = o || {};
  var v = obj[key] == null ? '' : obj[key];
  var inp = o.rows ? h('textarea', { rows: o.rows, cls: o.mono ? 'mono' : '', placeholder: o.ph || '', spellcheck: o.mono ? 'false' : null }) : h('input', { type: o.type || 'text', placeholder: o.ph || '' });
  inp.value = v;
  inp.oninput = function () { var x = inp.value; if (o.type === 'number') x = x === '' ? undefined : Number(x); if (x === undefined || (x === '' && o.dropEmpty)) delete obj[key]; else obj[key] = x; if (o.after) o.after(); changed(); };
  return h('label', { cls: 'f' }, label, o.hint ? h('div', { cls: 'hint', text: o.hint }) : null, inp);
}
/* a list of strings, one per line (or per blank-line paragraph) */
function lines(label, obj, key, o) {
  o = o || {};
  var sep = o.paras ? '\n\n' : '\n';
  var ta = h('textarea', { rows: o.rows || 4, placeholder: o.ph || (o.paras ? 'One paragraph per block, separated by an empty line' : 'One per line') });
  ta.value = (Array.isArray(obj[key]) ? obj[key] : obj[key] ? [obj[key]] : []).join(sep);
  ta.oninput = function () { obj[key] = ta.value.split(o.paras ? /\n\s*\n/ : /\n/).map(function (s) { return o.paras ? s.trim() : s.trim(); }).filter(Boolean); changed(); };
  return h('label', { cls: 'f' }, label, o.hint ? h('div', { cls: 'hint', text: o.hint }) : null, ta);
}
function select(label, obj, key, opts, after) {
  var s = h('select', null, opts.map(function (x) { var o = h('option', { value: x, text: x }); if (String(obj[key]) === x) o.selected = true; return o; }));
  s.onchange = function () { obj[key] = s.value; if (after) after(); else changed(); };
  return h('label', { cls: 'f' }, label, s);
}
/* edit any value as JSON; applied when it parses */
function jsonField(label, get, set, o) {
  o = o || {};
  var ta = h('textarea', { rows: o.rows || 8, cls: 'mono', spellcheck: 'false' }), err = h('div', { cls: 'jerr' });
  var v = get(); ta.value = v === undefined ? '' : JSON.stringify(v, null, 1);
  ta.oninput = function () {
    if (!ta.value.trim()) { err.textContent = ''; set(undefined); changed(); return; }
    try { var j = JSON.parse(ta.value); err.textContent = ''; set(j); changed(); } catch (e) { err.textContent = 'Not valid JSON yet: ' + e.message; }
  };
  return h('label', { cls: 'f' }, label, o.hint ? h('div', { cls: 'hint', text: o.hint }) : null, ta, err);
}
/* a list editor: items with move, duplicate and delete, and an add button */
function list(title, arr, renderItem, make, o) {
  o = o || {};
  var box = h('div');
  arr.forEach(function (it, i) {
    var mv = function (d) { var j = i + d; if (j < 0 || j >= arr.length) return; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; structural(); };
    box.appendChild(h('div', { cls: 'item' },
      h('div', { cls: 'head' }, h('span', { cls: 't', text: (o.label ? o.label(it, i) : (title + ' ' + (i + 1))) }),
        h('button', { cls: 'sm', title: 'Move up', onclick: function () { mv(-1); }, disabled: i === 0 }, '↑'),
        h('button', { cls: 'sm', title: 'Move down', onclick: function () { mv(1); }, disabled: i === arr.length - 1 }, '↓'),
        h('button', { cls: 'sm', title: 'Duplicate', onclick: function () { arr.splice(i + 1, 0, JSON.parse(JSON.stringify(it))); structural(); } }, 'Copy'),
        h('button', { cls: 'sm danger', title: 'Delete', onclick: function () { arr.splice(i, 1); structural(); } }, 'Delete')),
      renderItem(it, i)));
  });
  var add = o.adders || [['Add ' + title.toLowerCase(), make]];
  box.appendChild(h('div', { cls: 'row' }, add.map(function (a) { return h('button', { cls: 'sm', onclick: function () { arr.push(a[1]()); structural(); } }, '+ ' + a[0]); })));
  return box;
}
function sec(title, count, body, open) {
  var d = h('details', { cls: 'sec' }, h('summary', null, title, count != null ? h('span', { cls: 'cnt', text: '(' + count + ')' }) : null), h('div', { cls: 'body' }, body));
  if (open) d.open = true;
  var key = 'sec:' + title; if (secOpen[key] !== undefined) d.open = secOpen[key];
  d.ontoggle = function () { secOpen[key] = d.open; };
  return d;
}
var secOpen = {};
function arrOf(obj, key) { if (!Array.isArray(obj[key])) obj[key] = obj[key] ? [obj[key]] : []; return obj[key]; }

/* ---------- quiz questions (chapters and the final exam) ---------- */
function quizItem(q) {
  arrOf(q, 'options'); if (typeof q.answer !== 'number') q.answer = 0;
  var opts = h('div'), group = 'q' + (++quizSeq);
  function draw() {
    opts.textContent = '';
    q.options.forEach(function (op, k) {
      var r = h('input', { type: 'radio', name: group, title: 'Correct answer' }); r.checked = q.answer === k;
      r.onchange = function () { q.answer = k; changed(); };
      var t = h('input', { type: 'text', placeholder: 'Option ' + (k + 1) }); t.value = op; t.oninput = function () { q.options[k] = t.value; changed(); };
      opts.appendChild(h('div', { cls: 'opt' }, r, t, h('button', { cls: 'sm danger', title: 'Remove option', onclick: function () { q.options.splice(k, 1); if (q.answer >= q.options.length) q.answer = Math.max(0, q.options.length - 1); draw(); changed(); } }, '×')));
    });
    opts.appendChild(h('button', { cls: 'sm', onclick: function () { q.options.push(''); draw(); changed(); } }, '+ Option'));
  }
  draw();
  return h('div', null, field('Question', q, 'q'), h('div', { cls: 'hint', text: 'Options (pick the correct one):' }), opts, field('Explanation (shown after answering)', q, 'explain', { rows: 2 }));
}
var quizSeq = 0;
var newQuiz = function () { return { q: '', options: ['', '', ''], answer: 0, explain: '' }; };

/* ---------- lesson blocks ---------- */
function blockItem(b, i, ch) {
  if (typeof b === 'string') { ch.lesson[i] = b = { type: 'text', items: [b] }; }
  var type = b.type || 'text', body = h('div');
  body.appendChild(select('Type', b, 'type', BLOCKS, function () {
    var t = b.type; Object.keys(b).forEach(function (k) { if (k !== 'type') delete b[k]; });
    if (t === 'text') b.items = []; if (t === 'code') { b.lang = 'python'; b.code = ''; } if (t === 'math') b.tex = ''; if (t === 'figure') { b.image = ''; b.caption = ''; } if (t === 'map') { b.title = ''; b.links = []; }
    structural();
  }));
  if (type === 'text') body.appendChild(lines('Paragraphs', b, 'items', { paras: true, rows: 6, hint: 'Each paragraph is read aloud as one part of the lecture (keep each under about 450 characters). $...$ is inline math.' }));
  else if (type === 'code') { body.appendChild(field('Language', b, 'lang', { ph: 'python' })); body.appendChild(field('Code', b, 'code', { rows: 8, mono: true })); }
  else if (type === 'math') body.appendChild(field('Formula (LaTeX)', b, 'tex', { rows: 2, mono: true, ph: '\\frac{a}{b}' }));
  else if (type === 'figure') { body.appendChild(field('Image name (an SVG in the course "images")', b, 'image')); body.appendChild(field('Caption', b, 'caption')); }
  else if (type === 'map') { body.appendChild(field('Title', b, 'title')); body.appendChild(lines('Links', b, 'links', { hint: 'One per line: A | relation | B' })); }
  return body;
}

/* ---------- practice labs ---------- */
var LAB_NEW = {
  fill: function () { return { type: 'fill', title: 'Fill in the blanks', intro: '', text: 'The answer is {{word}}.', hint: '' }; },
  order: function () { return { type: 'order', title: 'Put in order', intro: '', items: ['First', 'Second', 'Third'], hint: '' }; },
  match: function () { return { type: 'match', title: 'Match', intro: '', pairs: [['term', 'meaning'], ['term', 'meaning']], hint: '' }; },
  python: function () { return { type: 'python', title: 'Python', intro: '', fn: 'solve', starter: 'def solve(x):\n    # your code\n    pass\n', tests: [{ args: [1], expect: 1 }], hint: '', solution: 'def solve(x):\n    return x\n' }; },
  write: function () { return { type: 'write', title: 'Write', prompt: '', checks: [{ re: 'keyword', msg: 'Mention the keyword' }] }; },
  code: function () { return { type: 'code', title: 'JavaScript', intro: '', fn: 'solve', starter: 'function solve(x) {\n  \n}\n', tests: [{ args: [1], expect: 1 }] }; },
  terminal: function () { return { type: 'terminal', title: 'Terminal', prompt: '$', commands: [{ re: '^ls$', out: 'file.txt' }], tasks: [{ text: 'List the files', cmd: 'ls' }] }; },
  webxdc: function () { return { type: 'webxdc', title: 'App', html: '<!doctype html><p>Hello</p>' }; }
};
function labItem(l) {
  var body = h('div');
  body.appendChild(h('div', { cls: 'muted', text: 'Type: ' + l.type }));
  body.appendChild(field('Title', l, 'title'));
  if (l.type !== 'write' && l.type !== 'terminal') body.appendChild(field('Instructions', l, 'intro', { rows: 2 }));
  if (l.type === 'fill') body.appendChild(field('Text with blanks', l, 'text', { rows: 3, hint: 'Put each answer in double braces: The capital of France is {{Paris}}. Several answers: {{color|colour}}.' }));
  else if (l.type === 'order') body.appendChild(lines('Items in the correct order', l, 'items', { hint: 'One per line; the app shuffles them.' }));
  else if (l.type === 'match') {
    var pairs = arrOf(l, 'pairs');
    body.appendChild(h('div', { cls: 'hint', text: 'Pairs (left matches right):' }));
    body.appendChild(list('Pair', pairs, function (p) {
      var a = h('input', { type: 'text', placeholder: 'Left' }), b = h('input', { type: 'text', placeholder: 'Right' }); a.value = p[0] || ''; b.value = p[1] || '';
      a.oninput = function () { p[0] = a.value; changed(); }; b.oninput = function () { p[1] = b.value; changed(); };
      return h('div', { cls: 'grid2' }, a, b);
    }, function () { return ['', '']; }));
  } else if (l.type === 'python') {
    body.appendChild(field('Function name', l, 'fn', { ph: 'solve' }));
    body.appendChild(field('Starter code (must fail the tests)', l, 'starter', { rows: 5, mono: true }));
    body.appendChild(jsonField('Tests', function () { return l.tests; }, function (v) { if (v === undefined) delete l.tests; else l.tests = v; }, { rows: 5, hint: 'A list of {"args": [...], "expect": value}. Results must be JSON (round floats). MicroPython: no f-strings.' }));
    body.appendChild(field('Solution', l, 'solution', { rows: 5, mono: true }));
  } else {
    body.appendChild(jsonField('Lab settings (JSON)', function () { var o = {}; Object.keys(l).forEach(function (k) { if (['type', 'title', 'intro', 'hint'].indexOf(k) < 0) o[k] = l[k]; }); return o; },
      function (v) { if (!v || typeof v !== 'object') return; Object.keys(l).forEach(function (k) { if (['type', 'title', 'intro', 'hint'].indexOf(k) < 0) delete l[k]; }); Object.keys(v).forEach(function (k) { if (['type', 'title', 'intro', 'hint'].indexOf(k) < 0) l[k] = v[k]; }); },
      { rows: 10, hint: l.type === 'write' ? '"prompt", "starter", "checks": [{"re": "regex", "msg": "what is missing"}]' : l.type === 'code' ? '"fn", "starter", "tests": [{"args": [...], "expect": ...}] (JavaScript)' : l.type === 'terminal' ? '"prompt", "banner", "commands": [{"re": "^ls$", "out": "..."}], "tasks": [{"text": "...", "cmd": "..."}]' : '"html", "files" {"index.html": ...} or "xdc" (base64)' }));
  }
  body.appendChild(field('Hint', l, 'hint', { rows: 2 }));
  return body;
}

/* ---------- the ELI5 block (first lesson block) ---------- */
function eli5Of(ch) {
  var b = (ch.lesson || [])[0];
  if (b && typeof b === 'object' && (b.type || 'text') === 'text' && Array.isArray(b.items) && (String(b.items[0] || '').indexOf(MARK) === 0 || String(b.items[0] || '').indexOf(OLDMARK) === 0))
    return { analogy: b.items[0].slice(String(b.items[0]).indexOf(MARK) === 0 ? MARK.length : OLDMARK.length).trim(), stall: '', has: true };
  return { analogy: '', stall: '', has: false };
}
function setEli5(ch, f) {
  var cur = eli5Of(ch); arrOf(ch, 'lesson');
  if (!f.analogy.trim()) { if (cur.has) ch.lesson.shift(); return; }
  var blk = { type: 'text', items: [MARK + ' ' + f.analogy.trim()] };
  if (cur.has) ch.lesson[0] = blk; else ch.lesson.unshift(blk);
}

/* ---------- views ---------- */
function renderCourse(m) {
  m.appendChild(h('h2', { text: 'Course' }));
  m.appendChild(sec('Basics', null, [
    field('Title', C, 'title'), field('Subtitle', C, 'subtitle'), field('Course id (letters, digits and dashes; used for the file name)', C, 'id', { ph: 'my-course' }),
    field('Author', C, 'author'), field('Description', C, 'description', { rows: 3 }),
    h('div', { cls: 'grid2' }, field('Category', C, 'category', { ph: 'Computer Science' }), field('Level', C, 'level', { ph: 'Beginner' })),
    (function () { var t = h('input', { type: 'text', placeholder: 'comma, separated, tags' }); t.value = (C.tags || []).join(', '); t.oninput = function () { C.tags = t.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean); changed(); }; return h('label', { cls: 'f' }, 'Tags', t); })()
  ], true));
  m.appendChild(sec('Pronunciation', null, [jsonField('Words Teacher should say differently', function () { return C.pronounce; }, function (v) { if (v === undefined) delete C.pronounce; else C.pronounce = v; }, { rows: 4, hint: '{"SQL": "sequel", "GPU": "G P U"}' })]));
  m.appendChild(sec('Advanced', null, [
    jsonField('Images (SVG text by name, for figure blocks)', function () { return C.images; }, function (v) { if (v === undefined) delete C.images; else C.images = v; }, { rows: 4 }),
    jsonField('Sandbox terminal', function () { return C.sandbox; }, function (v) { if (v === undefined) delete C.sandbox; else C.sandbox = v; }, { rows: 4 }),
    jsonField('Extra apps (webxdc)', function () { return C.apps; }, function (v) { if (v === undefined) delete C.apps; else C.apps = v; }, { rows: 4 })
  ]));
}
function renderChapter(m, i) {
  var ch = C.chapters[i]; if (!ch || typeof ch !== 'object') { C.chapters[i] = ch = newChapter(i + 1); }
  m.appendChild(h('div', { cls: 'row' }, h('h2', { text: 'Chapter ' + (i + 1) }),
    h('span', { style: 'margin-left:auto' }),
    h('button', { cls: 'sm', onclick: function () { if (i > 0) { C.chapters.splice(i - 1, 0, C.chapters.splice(i, 1)[0]); sel = { kind: 'ch', i: i - 1 }; structural(); } }, disabled: i === 0 }, 'Move up'),
    h('button', { cls: 'sm', onclick: function () { if (i < C.chapters.length - 1) { C.chapters.splice(i + 1, 0, C.chapters.splice(i, 1)[0]); sel = { kind: 'ch', i: i + 1 }; structural(); } }, disabled: i === C.chapters.length - 1 }, 'Move down'),
    h('button', { cls: 'sm', onclick: function () { C.chapters.splice(i + 1, 0, JSON.parse(JSON.stringify(ch))); sel = { kind: 'ch', i: i + 1 }; structural(); } }, 'Duplicate'),
    h('button', { cls: 'sm danger', onclick: function () { if (!confirm('Delete chapter ' + (i + 1) + ' "' + (ch.title || '') + '"? (Undo can bring it back.)')) return; C.chapters.splice(i, 1); sel = C.chapters.length ? { kind: 'ch', i: Math.min(i, C.chapters.length - 1) } : { kind: 'course' }; structural(); } }, 'Delete')));
  m.appendChild(field('Title', ch, 'title', { after: function () { renderSide(); } }));
  var f = eli5Of(ch), fo = { analogy: f.analogy, stall: f.stall };
  m.appendChild(sec('ELI5: explain it simply', f.has ? 1 : 0, [
    h('div', { cls: 'hint', text: 'Shown first in the lesson. An ELI5: a plain-words analogy, as if for a five-year-old.' }),
    field('ELI5 explanation', fo, 'analogy', { rows: 3, after: function () { setEli5(ch, fo); } })], !f.has));
  m.appendChild(sec('Summary', arrOf(ch, 'summary').length, [lines('Sentences', ch, 'summary', { rows: 3 })], true));
  m.appendChild(sec('Key points', arrOf(ch, 'keyPoints').length, [lines('Points', ch, 'keyPoints', { rows: 4 })]));
  m.appendChild(sec('Glossary', arrOf(ch, 'glossary').length, [list('Term', ch.glossary, function (g) { return h('div', { cls: 'grid2' }, field('Term', g, 'term'), field('Definition', g, 'def', { rows: 2 })); }, function () { return { term: '', def: '' }; }, { label: function (g) { return g.term || 'Term'; } })]));
  var lessonStart = f.has ? 1 : 0;
  m.appendChild(sec('Lesson', arrOf(ch, 'lesson').length - lessonStart, [list('Block', ch.lesson, function (b, k) { return k === 0 && f.has ? h('div', { cls: 'muted', text: 'The ELI5 block (edit it above).' }) : blockItem(b, k, ch); },
    function () { return { type: 'text', items: [] }; }, { label: function (b, k) { return k === 0 && f.has ? 'ELI5' : 'Block ' + (k + 1 - lessonStart) + ': ' + ((b && b.type) || 'text'); },
      adders: [['Text', function () { return { type: 'text', items: [] }; }], ['Code', function () { return { type: 'code', lang: 'python', code: '' }; }], ['Math', function () { return { type: 'math', tex: '' }; }], ['Map', function () { return { type: 'map', title: '', links: [] }; }]] })], true));
  m.appendChild(sec('Quiz', arrOf(ch, 'quiz').length, [list('Question', ch.quiz, quizItem, newQuiz)]));
  m.appendChild(sec('Flashcards', arrOf(ch, 'cards').length, [list('Card', ch.cards, function (c) { return h('div', { cls: 'grid2' }, field('Front', c, 'q', { rows: 2 }), field('Back', c, 'a', { rows: 2 })); }, function () { return { q: '', a: '' }; })]));
  m.appendChild(sec('Concept maps', arrOf(ch, 'maps').length, [list('Map', ch.maps, function (mp) { return h('div', null, field('Title', mp, 'title'), lines('Links', mp, 'links', { hint: 'One per line: A | relation | B (add [ch2] after a concept to link to chapter 2)' })); }, function () { return { title: '', links: [] }; })]));
  m.appendChild(sec('Practice labs', arrOf(ch, 'practice').length, [list('Lab', ch.practice, labItem, null, { label: function (l) { return (l.title || 'Lab') + ' (' + l.type + ')'; }, adders: LABS.map(function (t) { return [t, LAB_NEW[t]]; }) })]));
  m.appendChild(sec('Chapter JSON', null, [jsonField('Everything in this chapter', function () { return ch; }, function (v) { if (v && typeof v === 'object' && !Array.isArray(v)) { C.chapters[i] = v; } }, { rows: 16, hint: 'Edits apply when the JSON is valid. Reopen the chapter to see them in the forms.' })]));
}
function renderExam(m) {
  m.appendChild(h('h2', { text: 'Final exam' }));
  var on = !!C.finalExam;
  m.appendChild(h('div', { cls: 'hint', text: 'Optional. Without it the app builds the exam from the chapter quizzes.' }));
  m.appendChild(h('button', { onclick: function () { if (on) { if (!confirm('Remove the final exam?')) return; delete C.finalExam; } else C.finalExam = { title: 'Final exam', passMark: 70, size: 20, questions: [] }; structural(); } }, on ? 'Remove the final exam' : 'Add a final exam'));
  if (!on) return;
  var fe = C.finalExam; if (Array.isArray(fe)) fe = C.finalExam = { title: 'Final exam', passMark: 70, size: 0, questions: fe };
  m.appendChild(field('Title', fe, 'title'));
  m.appendChild(h('div', { cls: 'grid2' }, field('Pass mark (%)', fe, 'passMark', { type: 'number' }), field('Questions per attempt (0 = all)', fe, 'size', { type: 'number' })));
  m.appendChild(sec('Questions', arrOf(fe, 'questions').length, [list('Question', fe.questions, quizItem, newQuiz)], true));
}
function renderJson(m) {
  m.appendChild(h('h2', { text: 'Whole course (JSON)' }));
  m.appendChild(jsonField('Course', function () { return C; }, function (v) { if (v && typeof v === 'object' && !Array.isArray(v) && Array.isArray(v.chapters)) C = v; }, { rows: 30, hint: 'Edits apply when the JSON is valid and has "chapters".' }));
}
function render() {
  renderSide();
  var m = $('#ed'); m.textContent = '';
  if (sel.kind === 'ch' && C.chapters[sel.i] !== undefined) renderChapter(m, sel.i);
  else if (sel.kind === 'exam') renderExam(m);
  else if (sel.kind === 'json') renderJson(m);
  else { sel = { kind: 'course' }; renderCourse(m); }
}
function chapterIssues(i) { if (!V) return 0; var n = 0, re = new RegExp('^chapter ' + (i + 1) + '\\b'); (V.errors.concat(V.warnings)).forEach(function (w) { if (re.test(w)) n++; }); return n; }
function renderSide() {
  var s = $('#side'); s.textContent = '';
  var nav = function (label, k, extra) { var on = sel.kind === k.kind && (k.i === undefined || k.i === sel.i); return h('button', { cls: 'nav' + (on ? ' on' : ''), onclick: function () { sel = k; render(); window.scrollTo(0, 0); } }, label, extra); };
  s.appendChild(nav('Course: ' + (C.title || 'untitled'), { kind: 'course' }));
  s.appendChild(h('div', { cls: 'muted', style: 'margin:10px 4px 2px', text: 'Chapters' }));
  var cl = h('div', { id: 'chlist' });
  (C.chapters || []).forEach(function (ch, i) { var n = chapterIssues(i); cl.appendChild(nav([h('span', { cls: 'n', text: String(i + 1) }), (ch && ch.title) || 'untitled'], { kind: 'ch', i: i }, n ? h('span', { cls: 'bad', text: '• ' + n }) : null)); });
  s.appendChild(cl);
  s.appendChild(h('button', { cls: 'sm', style: 'margin:6px 0', onclick: function () { C.chapters.push(newChapter(C.chapters.length + 1)); sel = { kind: 'ch', i: C.chapters.length - 1 }; structural(); } }, '+ Add chapter'));
  s.appendChild(h('div', { cls: 'muted', style: 'margin:10px 4px 2px', text: 'More' }));
  s.appendChild(nav('Final exam' + (C.finalExam ? '' : ' (none)'), { kind: 'exam' }));
  s.appendChild(nav('Whole course JSON', { kind: 'json' }));
}

/* ---------- checking (the app's own validator) ---------- */
function validate() {
  clearTimeout(valT);
  valT = setTimeout(function () {
    var out = $('#issues'); out.textContent = '';
    try { V = K.validate(JSON.parse(JSON.stringify(C))); } catch (e) { V = { ok: false, errors: ['Checking failed: ' + e.message], warnings: [] }; }
    var st = $('#vstat');
    st.textContent = !V.ok ? V.errors.length + ' error(s)' : V.warnings.length ? V.warnings.length + ' warning(s)' : 'Ready';
    st.className = 'badge ' + (!V.ok ? 'err' : V.warnings.length ? 'warn' : 'ok');
    out.appendChild(h('h3', { text: 'Check' }));
    if (V.ok) {
      var c = V.course, labs = 0, py = 0, q = 0; c.chapters.forEach(function (ch) { labs += ch.practice.length; py += ch.practice.filter(function (l) { return l.type === 'python'; }).length; q += ch.quiz.length; });
      out.appendChild(h('div', { cls: 'stats', text: c.chapters.length + ' chapters, ' + labs + ' labs (' + py + ' Python), ' + q + ' quiz questions' + (c.exam ? ', ' + c.exam.questions.length + '-question exam' : '') + '. File: ' + c.id + '.course.json' }));
      var nof = C.chapters.filter(function (ch) { return ch && !eli5Of(ch).has; }).length;
      if (nof) out.appendChild(h('div', { cls: 'issue', text: nof + ' chapter(s) have no ELI5 block (optional, but recommended).' }));
    }
    V.errors.forEach(function (e) { out.appendChild(h('div', { cls: 'issue err', text: e })); });
    V.warnings.forEach(function (w) {
      var m = /^chapter (\d+)/.exec(w), d = h('div', { cls: 'issue', text: w });
      if (m) d.onclick = function () { sel = { kind: 'ch', i: +m[1] - 1 }; render(); };
      out.appendChild(d);
    });
    if (V.ok && !V.warnings.length) out.appendChild(h('div', { cls: 'ok', text: 'No problems found. The app will import this course.' }));
    renderSide();
  }, 150);
}

/* ---------- files ---------- */
function fileName() { return ((V && V.course && V.course.id) || 'course') + '.course.json'; }
function download() {
  var a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(C, null, 1)], { type: 'application/json' })), download: fileName() });
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Downloaded ' + fileName() + (V && !V.ok ? ' (it still has errors)' : ''));
}
function openText(t, from) { var j; try { j = JSON.parse(t); } catch (e) { throw new Error('Not valid JSON: ' + e.message); } setCourse(j, 'Opened ' + from); }
function dialog(build) { var d = $('#dlg'); d.textContent = ''; build(d); if (!d.open) d.showModal(); return d; }
function confirmReplace() { return !C.chapters.length || confirm('Replace the course you are editing? (Download it first if you want to keep it. Undo also works.)'); }
$('#bNew').onclick = function () { if (confirmReplace()) setCourse(blank(), 'New course'); };
$('#bOpen').onclick = function () { $('#fin').click(); };
$('#fin').onchange = function (e) {
  var f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (f.size > 25 * 1024 * 1024) { toast('That file is too big.'); return; }
  var r = new FileReader(); r.onload = function () { try { if (confirmReplace()) openText(String(r.result), f.name); } catch (er) { toast(er.message); } }; r.onerror = function () { toast('Could not read the file.'); }; r.readAsText(f);
};
$('#bPaste').onclick = function () {
  dialog(function (d) {
    var ta = h('textarea', { rows: 12, cls: 'mono', style: 'width:100%', placeholder: '{"format": "lilith-course", ...}' }), err = h('div', { cls: 'jerr' });
    d.appendChild(h('h3', { text: 'Paste a course' })); d.appendChild(ta); d.appendChild(err);
    d.appendChild(h('div', { cls: 'row', style: 'justify-content:flex-end;margin-top:10px' }, h('button', { onclick: function () { d.close(); } }, 'Cancel'),
      h('button', { cls: 'pri', onclick: function () { try { openText(ta.value, 'pasted JSON'); d.close(); } catch (e) { err.textContent = e.message; } } }, 'Open')));
  });
};
$('#bLib').onclick = function () {
  dialog(function (d) {
    var box = h('div', { text: 'Loading the course list...' });
    d.appendChild(h('h3', { text: 'Open a course from the library' })); d.appendChild(h('div', { cls: 'hint', text: 'Start from one of the free courses and make it your own.' })); d.appendChild(box);
    d.appendChild(h('div', { cls: 'row', style: 'justify-content:flex-end;margin-top:10px' }, h('button', { onclick: function () { d.close(); } }, 'Close')));
    fetch('../catalog.json').then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).catch(function () { return fetch(RAW + 'catalog.json').then(function (r) { return r.json(); }); }).then(function (cat) {
      box.textContent = '';
      (cat.courses || []).forEach(function (c) {
        box.appendChild(h('button', { cls: 'nav', onclick: function () {
          if (!confirmReplace()) return; box.textContent = 'Downloading ' + c.title + '...';
          fetch((cat.raw || RAW) + c.file).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then(function (t) { openText(t, c.title); d.close(); }).catch(function (e) { box.textContent = 'Could not download it: ' + e.message; });
        } }, c.title + ' ', h('span', { cls: 'muted', text: c.chapters + ' chapters' })));
      });
    }).catch(function (e) { box.textContent = 'Could not load the course list: ' + e.message; });
  });
};
$('#bUndo').onclick = function () { if (!undo.length) return; var t = undo.pop(); C = JSON.parse(t); last = t; persist(); validate(); render(); $('#bUndo').disabled = !undo.length; toast('Undone'); };
document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); $('#bUndo').onclick(); } });
$('#bDown').onclick = download;
$('#bTry').onclick = function () {
  if (V && !V.ok) { toast('Fix the errors first: ' + V.errors[0]); return; }
  try { localStorage.setItem(HANDOFF, JSON.stringify(C)); } catch (e) { toast('Not enough storage to hand the course over. Download it and import it in the app.'); return; }
  window.open('../app/#import-handoff', '_blank');
};
window.addEventListener('beforeunload', function () { clearTimeout(saveT); snapshot(); persist(); });
window.__editor = { get C() { return C; }, setCourse: setCourse, validate: function () { return V; } };
$('#bUndo').disabled = true;
render(); validate();
})();
</script>
