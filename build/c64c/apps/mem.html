<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{font:15px system-ui,Roboto,sans-serif;margin:0;padding:12px;background:#150d27;color:#f1ebff}
button,select{font:inherit;border:0;border-radius:20px;padding:8px 14px;background:#2d2046;color:#e7d9ff;font-weight:600;margin:3px 3px 3px 0}
button.on{background:#b26bff;color:#1b0b33}.m{color:#c9b8e8;margin:6px 0}.ok{color:#8fe3a8}.bad{color:#ff9b9b}
textarea,input[type=text],input[type=number]{width:100%;font:13px ui-monospace,Menlo,monospace;background:#0e0820;color:#f1ebff;border:1px solid #3a2a5c;border-radius:8px;padding:8px}
canvas{max-width:100%;image-rendering:pixelated;border-radius:6px}
table{border-collapse:collapse;font-size:13px}td,th{padding:3px 8px;border-bottom:1px solid #3a2a5c;text-align:left}
code,.mono{font-family:ui-monospace,Menlo,monospace;color:#ffd27f}.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.reg{font:13px ui-monospace,monospace;background:#0e0820;border-radius:8px;padding:6px 8px;margin:6px 0;white-space:pre-wrap}
table td,table th{padding:3px 6px}.mono{font-family:ui-monospace,monospace}.bit{display:inline-block;width:30px;text-align:center;border-radius:6px;margin:1px;padding:4px 0;background:#2d2046;cursor:pointer;font:12px ui-monospace,monospace}.bit.on{background:#b26bff;color:#1b0b33}</style></head><body><div class="m">The 6510 sees 64 KB, but ROMs and the I/O chips share addresses with RAM. Three bits of $0001 choose the view. Try at least four different settings, including one that shows the character ROM and one that shows only RAM.</div>
<div class="row"><span class="bit" id="b0">LORAM</span><span class="bit" id="b1">HIRAM</span><span class="bit" id="b2">CHAREN</span> <span class="mono">$0001 low bits = <b id="v"></b></span></div>
<table id="t"></table><div class="row">Probe address $<input type="text" id="pa" value="D000" style="width:90px"><span id="pr" class="mono"></span></div><div id="g" class="m"></div>
<script>function done(){try{if(window.lilith)lilith.complete()}catch(e){}}var $=function(i){return document.getElementById(i)};function hex(v,n){var s=v.toString(16).toUpperCase();while(s.length<n)s='0'+s;return s}

var bits=[1,1,1],seen={};
function view(l,h,c){var basic=l&&h?"BASIC ROM":"RAM",kern=h?"KERNAL ROM":"RAM",d=(l||h)?(c?"I/O (VIC, SID, CIA)":"Character ROM"):"RAM";return {a:basic,d:d,e:kern}}
function render(){var v=bits[0]|(bits[1]<<1)|(bits[2]<<2);$("v").textContent="%"+(v+8).toString(2).slice(1)+" ("+v+")";var m=view(bits[0],bits[1],bits[2]);
 [0,1,2].forEach(function(i){$("b"+i).className="bit"+(bits[i]?" on":"")});
 $("t").innerHTML="<tr><th>Range</th><th>What the CPU sees</th></tr><tr><td>$0000-$9FFF</td><td>RAM</td></tr><tr><td>$A000-$BFFF</td><td>"+m.a+"</td></tr><tr><td>$C000-$CFFF</td><td>RAM</td></tr><tr><td>$D000-$DFFF</td><td>"+m.d+"</td></tr><tr><td>$E000-$FFFF</td><td>"+m.e+"</td></tr>";
 seen[v]=m;probe();var n=Object.keys(seen).length,ch=false,ram=false;for(var k in seen){if(seen[k].d=="Character ROM")ch=true;if(seen[k].d=="RAM"&&seen[k].a=="RAM"&&seen[k].e=="RAM")ram=true}
 $("g").innerHTML="Settings tried: "+n+" / 4. Character ROM seen: "+(ch?"yes":"no")+". Pure RAM seen: "+(ram?"yes":"no");if(n>=4&&ch&&ram)done()}
function probe(){var a=parseInt($("pa").value,16)||0,m=view(bits[0],bits[1],bits[2]),w="RAM";if(a>=0xA000&&a<0xC000)w=m.a;else if(a>=0xD000&&a<0xE000)w=m.d;else if(a>=0xE000)w=m.e;$("pr").textContent="$"+hex(a&65535,4)+" is "+w}
[0,1,2].forEach(function(i){$("b"+i).onclick=function(){bits[i]^=1;render()}});$("pa").oninput=probe;render();
</script></body></html>
