<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{font:15px system-ui,Roboto,sans-serif;margin:0;padding:12px;background:#150d27;color:#f1ebff}
button,select{font:inherit;border:0;border-radius:20px;padding:8px 14px;background:#2d2046;color:#e7d9ff;font-weight:600;margin:3px 3px 3px 0}
button.on{background:#b26bff;color:#1b0b33}.m{color:#c9b8e8;margin:6px 0}.ok{color:#8fe3a8}.bad{color:#ff9b9b}
textarea,input[type=text],input[type=number]{width:100%;font:13px ui-monospace,Menlo,monospace;background:#0e0820;color:#f1ebff;border:1px solid #3a2a5c;border-radius:8px;padding:8px}
canvas{max-width:100%;image-rendering:pixelated;border-radius:6px}
table{border-collapse:collapse;font-size:13px}td,th{padding:3px 8px;border-bottom:1px solid #3a2a5c;text-align:left}
code,.mono{font-family:ui-monospace,Menlo,monospace;color:#ffd27f}.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.reg{font:13px ui-monospace,monospace;background:#0e0820;border-radius:8px;padding:6px 8px;margin:6px 0;white-space:pre-wrap}
table td,table th{padding:3px 6px}.mono{font-family:ui-monospace,monospace}.bit{display:inline-block;width:30px;text-align:center;border-radius:6px;margin:1px;padding:4px 0;background:#2d2046;cursor:pointer;font:12px ui-monospace,monospace}.bit.on{background:#b26bff;color:#1b0b33}</style></head><body><div class="m">A 1541 disk (D64 image) has 35 tracks. Outer tracks hold more sectors. Pick a track and sector to see which block of the image it is and where it sits in the file. Then add a file to the directory sector at track 18, sector 1.</div>
<div class="row">Track <input type="text" id="tr" value="18" style="width:70px"> Sector <input type="text" id="se" value="1" style="width:70px"><button id="go" class="go">Locate</button></div>
<div id="loc" class="mono"></div>
<div class="row">File name <input type="text" id="fn" value="HELLO" maxlength="16" style="width:150px"> Blocks <input type="text" id="bl" value="3" style="width:60px"><button id="add" class="go">Add to directory</button></div>
<div id="dir" class="mono" style="white-space:pre-wrap;font-size:12px"></div><div id="g" class="m"></div>
<script>function done(){try{if(window.lilith)lilith.complete()}catch(e){}}var $=function(i){return document.getElementById(i)};function hex(v,n){var s=v.toString(16).toUpperCase();while(s.length<n)s='0'+s;return s}

function spt(t){return t<=17?21:t<=24?19:t<=30?18:17}
function block(t,s){var b=0;for(var i=1;i<t;i++)b+=spt(i);return b+s}
var looked={},added=0;
function locate(){var t=+$("tr").value,s=+$("se").value;if(!(t>=1&&t<=35)||!(s>=0&&s<spt(t))){$("loc").textContent="Track 1-35; this track has sectors 0-"+(t>=1&&t<=35?spt(t)-1:"?");return}
 var b=block(t,s);looked[t+","+s]=1;$("loc").innerHTML="Track "+t+" has "+spt(t)+" sectors.<br>Block index = "+b+" (of 683)<br>Byte offset in the .d64 file = "+b+" x 256 = $"+hex(b*256,5)+"<br>Each sector stores 254 data bytes after the two-byte link (next track, next sector).";chk()}
function chk(){var l18=looked["18,1"],n=Object.keys(looked).length;$("g").innerHTML="Looked up track 18 sector 1: "+(l18?"yes":"no")+". Another sector: "+(n>=2?"yes":"no")+". Files added: "+added;if(l18&&n>=2&&added>=1)done()}
var files=[];
$("add").onclick=function(){var n=$("fn").value.toUpperCase().slice(0,16),b=Math.max(1,Math.min(255,+$("bl").value||1));files.push({n:n,b:b});var used=files.reduce(function(a,f){return a+f.b},0),out="";
 files.forEach(function(f,i){var e=[0x82,18+0,0,f.b&255,0];var nm=f.n;while(nm.length<16)nm+="\u00a0";out+="entry "+(i+1)+" (32 bytes): type $82 (PRG), first track/sector, name "+JSON.stringify(f.n)+" padded with $A0, "+f.b+" blocks\n"});
 out+="\nBlocks free = 664 - "+used+" = "+(664-used);$("dir").textContent=out;added=files.length;chk()};
$("go").onclick=locate;locate();
</script></body></html>
