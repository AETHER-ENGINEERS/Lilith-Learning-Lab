<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{font:15px system-ui,Roboto,sans-serif;margin:0;padding:12px;background:#150d27;color:#f1ebff}
button,select{font:inherit;border:0;border-radius:20px;padding:8px 14px;background:#2d2046;color:#e7d9ff;font-weight:600;margin:3px 3px 3px 0}
button.on{background:#b26bff;color:#1b0b33}.m{color:#c9b8e8;margin:6px 0}.ok{color:#8fe3a8}.bad{color:#ff9b9b}
textarea,input[type=text],input[type=number]{width:100%;font:13px ui-monospace,Menlo,monospace;background:#0e0820;color:#f1ebff;border:1px solid #3a2a5c;border-radius:8px;padding:8px}
canvas{max-width:100%;image-rendering:pixelated;border-radius:6px}
table{border-collapse:collapse;font-size:13px}td,th{padding:3px 8px;border-bottom:1px solid #3a2a5c;text-align:left}
code,.mono{font-family:ui-monospace,Menlo,monospace;color:#ffd27f}.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.reg{font:13px ui-monospace,monospace;background:#0e0820;border-radius:8px;padding:6px 8px;margin:6px 0;white-space:pre-wrap}
table td,table th{padding:3px 6px}.mono{font-family:ui-monospace,monospace}.bit{display:inline-block;width:30px;text-align:center;border-radius:6px;margin:1px;padding:4px 0;background:#2d2046;cursor:pointer;font:12px ui-monospace,monospace}.bit.on{background:#b26bff;color:#1b0b33}</style></head><body><div class="m">The Datassette stores each bit as two pulses. Short, medium and long pulses are all you need. Type a few characters, then see the pulse train, the parity bit and the checksum.</div>
<input type="text" id="t" value="HI64" maxlength="12"><div class="row"><button id="b" class="go">Encode</button></div>
<canvas id="c" width="560" height="120"></canvas><div id="o" class="mono" style="white-space:pre-wrap;font-size:12px"></div><div id="g" class="m"></div>
<script>function done(){try{if(window.lilith)lilith.complete()}catch(e){}}var $=function(i){return document.getElementById(i)};function hex(v,n){var s=v.toString(16).toUpperCase();while(s.length<n)s='0'+s;return s}

var W={S:1,M:1.45,L:1.95};
function encode(bytes){var p=[],log="",x=0;bytes.forEach(function(b){var row="byte $"+hex(b,2)+": marker L M | bits LSB first ";p.push("L","M");var ones=0;for(var i=0;i<8;i++){var bit=(b>>i)&1;ones+=bit;p.push(bit?"M":"S",bit?"S":"M");row+=bit+" "}
 var par=ones%2?0:1;p.push(par?"M":"S",par?"S":"M");row+="| parity "+par+" (odd total)";log+=row+"\n";x^=b});p.push("L","S");log+="end of data: L S\nchecksum (XOR of all bytes) = $"+hex(x,2)+"\n";return {p:p,log:log,x:x}}
function draw(p){var c=$("c"),g=c.getContext("2d");g.clearRect(0,0,560,120);g.strokeStyle="#b26bff";g.lineWidth=2;g.beginPath();var x=4,hi=true,sc=11;g.moveTo(x,90);
 p.forEach(function(k){var w=W[k]*sc;if(x+w*2>556){return}g.lineTo(x,hi?30:90);g.lineTo(x+w,hi?30:90);hi=!hi;g.lineTo(x+w,hi?30:90);x+=w});g.stroke();g.fillStyle="#c9b8e8";g.font="11px sans-serif";g.fillText("each pulse is a half-wave; width = short, medium or long",8,112)}
$("b").onclick=function(){var s=$("t").value,by=[];for(var i=0;i<s.length;i++)by.push(s.charCodeAt(i)&255);if(!by.length)return;var r=encode(by);$("o").textContent=r.log+"pulses: "+r.p.join(" ");draw(r.p);$("g").textContent=by.length>=4?"Done: encoded "+by.length+" bytes.":"Encode at least 4 bytes.";if(by.length>=4)done()};
$("b").onclick();
</script></body></html>
