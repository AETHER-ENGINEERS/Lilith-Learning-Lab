<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{font:15px system-ui,Roboto,sans-serif;margin:0;padding:10px;background:#150d27;color:#f1ebff}
button,select{font:inherit;border:0;border-radius:18px;padding:8px 14px;background:#2d2046;color:#e7d9ff;font-weight:600;margin:2px}button.go{background:#b26bff;color:#1b0b33}
.card{background:#211538;border:1px solid #3a2a5c;border-radius:14px;padding:18px;margin:10px 0;text-align:center;min-height:130px}
.big{font-size:34px;line-height:1.3;margin:6px 0}.sm{color:#c9b8e8;font-size:13px}.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center}
.ok{color:#8fe3a8}.bad{color:#ff9b9b}.bar{height:8px;background:#2d2046;border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#b26bff}
.w{display:inline-block;margin:4px;padding:6px 8px;border:1px solid #3a2a5c;border-radius:10px;cursor:pointer;background:#1b1030}.w.on{background:#3a2a5c}.w b{display:block;font-size:22px}
.w span{display:block;font-size:11px;color:#c9b8e8}.rtl{direction:rtl}</style></head><body>
<div class="row"><select id="v"></select></div>
<div class="card" id="box"><div class="sm" id="ref"></div><div id="line" style="margin:8px 0"></div><div class="sm" id="info">Tap a word to see its sound and meaning.</div></div>
<div class="row"><button id="rev">Show smooth translation</button><button id="hide">Hide glosses</button></div>
<div class="card" id="free" style="display:none;min-height:0"></div>
<div class="sm" id="notes"></div><div class="sm" id="prog" style="margin-top:10px"></div>
<script>
var V=[{"id": "gen1_1_he", "lang": "Hebrew", "ref": "Genesis 1:1", "dir": "rtl", "words": [["בְּרֵאשִׁית", "bereshit", "in-beginning"], ["בָּרָא", "bara", "created"], ["אֱלֹהִים", "elohim", "God"], ["אֵת", "et", "(object marker)"], ["הַשָּׁמַיִם", "hashamayim", "the-heavens"], ["וְאֵת", "ve-et", "and (object marker)"], ["הָאָרֶץ", "ha-arets", "the-earth"]], "free": "In the beginning God created the heavens and the earth.", "notes": ["Hebrew reads right to left; the words here are listed in reading order.", "Be- = in; reshit = beginning. Ha- is the article 'the'. Ve- = and.", "Verb first: bara (created) comes before its subject Elohim. That is the usual Hebrew order."]}, {"id": "gen1_1_la", "lang": "Latin", "ref": "Genesis 1:1 (Vulgate)", "dir": "ltr", "words": [["In", "in", "in"], ["principio", "principio", "beginning (ablative)"], ["creavit", "creavit", "created"], ["Deus", "Deus", "God (nominative)"], ["caelum", "caelum", "heaven (accusative)"], ["et", "et", "and"], ["terram", "terram", "earth (accusative)"]], "free": "In the beginning God created heaven and earth.", "notes": ["Latin uses endings, not word order, to show roles: Deus is the subject, caelum and terram are objects (accusative).", "Principio ends in -o: ablative singular, after in = 'in the beginning'.", "There is no word for 'the' in Latin."]}, {"id": "gen1_1_gr", "lang": "Greek", "ref": "Genesis 1:1 (Septuagint)", "dir": "ltr", "words": [["Ἐν", "en", "in"], ["ἀρχῇ", "arche", "beginning (dative)"], ["ἐποίησεν", "epoiesen", "made, created"], ["ὁ", "ho", "the (nom. masc.)"], ["θεὸς", "theos", "God"], ["τὸν", "ton", "the (acc. masc.)"], ["οὐρανὸν", "ouranon", "heaven (acc.)"], ["καὶ", "kai", "and"], ["τὴν", "ten", "the (acc. fem.)"], ["γῆν", "gen", "earth (acc.)"]], "free": "In the beginning God made the heaven and the earth.", "notes": ["The article changes with the case: ho theos (subject), ton ouranon (object).", "En takes the dative: arche is dative, 'in the beginning'.", "The Greek Old Testament (Septuagint) is the Bible of the early church."]}, {"id": "john1_1", "lang": "Greek", "ref": "John 1:1", "dir": "ltr", "words": [["Ἐν", "en", "in"], ["ἀρχῇ", "arche", "beginning"], ["ἦν", "en", "was"], ["ὁ", "ho", "the"], ["λόγος", "logos", "word"], ["καὶ", "kai", "and"], ["ὁ", "ho", "the"], ["λόγος", "logos", "word"], ["ἦν", "en", "was"], ["πρὸς", "pros", "toward, with"], ["τὸν", "ton", "the"], ["θεόν", "theon", "God (acc.)"]], "free": "In the beginning was the Word, and the Word was with God.", "notes": ["En (in) and en (was, with a different accent and breathing) look alike. Context tells them apart.", "Pros takes the accusative here, so theon is the accusative of theos.", "Ho logos has the article: 'the Word'."]}, {"id": "john1_1_la", "lang": "Latin", "ref": "John 1:1 (Vulgate)", "dir": "ltr", "words": [["In", "in", "in"], ["principio", "principio", "beginning"], ["erat", "erat", "was"], ["Verbum", "verbum", "Word (nom.)"], ["et", "et", "and"], ["Verbum", "verbum", "Word"], ["erat", "erat", "was"], ["apud", "apud", "with, beside"], ["Deum", "Deum", "God (acc.)"]], "free": "In the beginning was the Word, and the Word was with God.", "notes": ["Erat is the imperfect of sum: 'was' for a continuing state.", "Apud takes the accusative: Deum.", "Compare the Greek: en arche en ho logos. Same shape, word for word."]}, {"id": "gen1_3_he", "lang": "Hebrew", "ref": "Genesis 1:3", "dir": "rtl", "words": [["וַיֹּאמֶר", "vayomer", "and-said"], ["אֱלֹהִים", "elohim", "God"], ["יְהִי", "yehi", "let-be"], ["אוֹר", "or", "light"], ["וַיְהִי", "vayehi", "and-it-was"], ["אוֹר", "or", "light"]], "free": "And God said, 'Let there be light,' and there was light.", "notes": ["Vayomer = vav + yomer: the 'vav-consecutive' that tells a story in sequence.", "Yehi is a command form of hayah, 'to be'. Hebrew has no 'there'.", "Or means light; Latin lux, Greek phos."]}, {"id": "gen1_3_la", "lang": "Latin", "ref": "Genesis 1:3 (Vulgate)", "dir": "ltr", "words": [["Dixitque", "dixitque", "and-said"], ["Deus", "Deus", "God"], ["Fiat", "fiat", "let it be made"], ["lux", "lux", "light"], ["et", "et", "and"], ["facta", "facta", "made"], ["est", "est", "is/was"], ["lux", "lux", "light"]], "free": "And God said: Let there be light. And light was made.", "notes": ["-que on the end of a word means 'and'.", "Fiat is a subjunctive: 'let it happen'. It gives us the word fiat.", "Facta est: a perfect passive, 'was made'."]}, {"id": "shema_he", "lang": "Hebrew", "ref": "Deuteronomy 6:4", "dir": "rtl", "words": [["שְׁמַע", "shema", "hear!"], ["יִשְׂרָאֵל", "yisrael", "Israel"], ["יְהוָה", "adonai", "the LORD"], ["אֱלֹהֵינוּ", "eloheinu", "our-God"], ["יְהוָה", "adonai", "the LORD"], ["אֶחָד", "echad", "one"]], "free": "Hear, O Israel: the LORD our God, the LORD is one.", "notes": ["Shema is an imperative: 'hear!' Its root shin-mem-ayin is the same as in the vocabulary list.", "-einu is the ending 'our': Elohim + our = eloheinu.", "No verb 'is': the sentence is just a list of nouns. Hebrew leaves 'is' out."]}, {"id": "shema_la", "lang": "Latin", "ref": "Deuteronomy 6:4 (Vulgate)", "dir": "ltr", "words": [["Audi", "audi", "hear!"], ["Israel", "Israel", "Israel"], ["Dominus", "Dominus", "Lord"], ["Deus", "Deus", "God"], ["noster", "noster", "our"], ["Dominus", "Dominus", "Lord"], ["unus", "unus", "one"], ["est", "est", "is"]], "free": "Hear, O Israel: the Lord our God is one Lord.", "notes": ["Audi is the singular imperative of audire, the root of 'audio'.", "Noster agrees with Deus: masculine, nominative, singular.", "Latin adds est, 'is', where Hebrew leaves it out."]}, {"id": "ps23_he", "lang": "Hebrew", "ref": "Psalm 23:1", "dir": "rtl", "words": [["יְהוָה", "adonai", "the LORD"], ["רֹעִי", "roi", "my-shepherd"], ["לֹא", "lo", "not"], ["אֶחְסָר", "echsar", "I-will-lack"]], "free": "The LORD is my shepherd; I shall not want.", "notes": ["Roi = ro'eh (shepherd) + i (my).", "Lo = not. It also appears in the phrase list.", "Echsar is imperfect, first person: 'I will lack'."]}, {"id": "ps23_la", "lang": "Latin", "ref": "Psalm 22:1 (Vulgate numbering)", "dir": "ltr", "words": [["Dominus", "Dominus", "the Lord"], ["regit", "regit", "rules, guides"], ["me", "me", "me"], ["et", "et", "and"], ["nihil", "nihil", "nothing"], ["mihi", "mihi", "to-me"], ["deerit", "deerit", "will-be-lacking"]], "free": "The Lord rules me, and nothing will be lacking to me.", "notes": ["Me is accusative (object), mihi is dative (to me).", "Deerit is a future of deesse, 'to be lacking'.", "The Vulgate numbers the Psalms differently, so Psalm 23 is 22 here."]}, {"id": "1john4_8", "lang": "Greek", "ref": "1 John 4:8", "dir": "ltr", "words": [["ὁ", "ho", "the"], ["θεὸς", "theos", "God"], ["ἀγάπη", "agape", "love"], ["ἐστίν", "estin", "is"]], "free": "God is love.", "notes": ["Both nouns are nominative: God is love, not 'love is God'. The article marks the subject.", "Estin is the 'is' of Greek, from eimi.", "Latin: Deus caritas est. Same words in the same order."]}, {"id": "pater", "lang": "Latin", "ref": "Matthew 6:9 (Vulgate)", "dir": "ltr", "words": [["Pater", "pater", "Father"], ["noster", "noster", "our"], ["qui", "qui", "who"], ["es", "es", "you-are"], ["in", "in", "in"], ["caelis", "caelis", "the-heavens (abl. pl.)"]], "free": "Our Father, who are in the heavens.", "notes": ["Es is the 'you are' of sum.", "Caelis is plural ablative, after in.", "Greek: Pater hemon ho en tois ouranois."]}];var $=function(i){return document.getElementById(i)};
function done(){try{if(window.lilith)lilith.complete()}catch(e){}}
var seen={},cur=0,gloss=true;
V.forEach(function(v,i){var o=document.createElement("option");o.value=i;o.textContent=v.lang+": "+v.ref;$("v").appendChild(o)});
function draw(){var v=V[cur];seen[cur]=1;$("ref").textContent=v.lang+", "+v.ref;var h="";
 v.words.forEach(function(w,i){h+="<div class='w'"+" data-i='"+i+"'><b"+(v.lang=="Hebrew"?" class='rtl'":"")+">"+w[0]+"</b><span>"+w[1]+"</span>"+(gloss?"<span class='ok'>"+w[2]+"</span>":"")+"</div>"});
 $("line").innerHTML="<div class='"+(v.dir=="rtl"?"rtl":"")+"'>"+h+"</div>";
 Array.prototype.forEach.call(document.querySelectorAll(".w"),function(el){el.onclick=function(){var w=v.words[+el.dataset.i];$("info").textContent=w[0]+"  \u2192  "+w[1]+"  =  "+w[2];Array.prototype.forEach.call(document.querySelectorAll(".w"),function(x){x.className="w"});el.className="w on"}});
 $("free").style.display="none";$("rev").textContent="Show smooth translation";$("free").textContent=v.free;
 $("notes").innerHTML="<b>Grammar notes</b><ul>"+v.notes.map(function(n){return"<li>"+n+"</li>"}).join("")+"</ul>";
 var n=Object.keys(seen).length;$("prog").textContent="Read "+n+" of "+V.length+" passages (open them all to finish).";if(n>=V.length)done()}
$("v").onchange=function(){cur=+$("v").value;draw()};
$("rev").onclick=function(){var f=$("free");f.style.display=f.style.display=="none"?"":"none";$("rev").textContent=f.style.display=="none"?"Show smooth translation":"Hide smooth translation"};
$("hide").onclick=function(){gloss=!gloss;$("hide").textContent=gloss?"Hide glosses":"Show glosses";draw()};
draw();
</script></body></html>
