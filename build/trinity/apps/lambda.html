<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{font:15px system-ui,Roboto,sans-serif;margin:0;padding:12px;background:#150d27;color:#f1ebff}
button{font:inherit;border:0;border-radius:20px;padding:8px 14px;background:#b26bff;color:#1b0b33;font-weight:600;margin:3px 3px 3px 0}
button.t{background:#2d2046;color:#e7d9ff}input{font:16px ui-monospace,monospace;width:100%;padding:8px;border-radius:10px;border:1px solid #4a3770;background:#1e1336;color:#f1ebff}
.m{color:#c9b8e8}pre{background:#1e1336;border-radius:10px;padding:10px;margin:8px 0;white-space:pre-wrap;font:14px ui-monospace,monospace}.err{color:#ff9bb0}.row{display:flex;flex-wrap:wrap;gap:4px}
.cur{outline:1px solid #b26bff}</style></head><body>
<div class="m">Untyped lambda calculus. Write \x. or λx. for a function; application is a space. Example: (\x. x x) (\y. y)</div>
<input id="in" value="(\x. \y. \z. x z (y z)) (\x. \y. x) (\x. \y. x) a" autocomplete="off" autocapitalize="off" spellcheck="false">
<div class="row"><button id="go">Start</button><button id="st" class="t">Step</button><button id="all" class="t">Run to the end</button></div>
<div class="row" id="ex"></div><pre id="out"></pre><div class="m" id="msg"></div>
<script>
function done(){try{if(window.lilith)lilith.complete()}catch(e){}}
function parse(s){s=s.replace(/\\/g,'λ');var t=[],i=0;
while(i<s.length){var c=s[i];if(/\s/.test(c)){i++}else if('()λ.'.indexOf(c)>=0){t.push(c);i++}else{var j=i;while(j<s.length&&/[A-Za-z0-9_']/.test(s[j]))j++;if(j===i)throw new Error('Unexpected character '+c);t.push(s.slice(i,j));i=j}}
var p=0;function peek(){return t[p]}function eat(x){if(t[p]!==x)throw new Error('Expected '+x);p++}
function atom(){var c=peek();if(c==='('){p++;var e=expr();eat(')');return e}if(c==='λ')return lam();
if(c&&/^[A-Za-z0-9_']/.test(c)){p++;return {k:'v',n:c}}throw new Error('Unexpected '+(c||'end of input'))}
function lam(){eat('λ');var xs=[];while(peek()&&/^[A-Za-z0-9_']/.test(peek())){xs.push(t[p++])}if(!xs.length)throw new Error('Missing parameter');eat('.');var b=expr();for(var i=xs.length-1;i>=0;i--)b={k:'l',x:xs[i],b:b};return b}
function expr(){if(peek()==='λ')return lam();var e=atom();while(peek()&&peek()!==')'&&peek()!=='.'){e={k:'a',f:e,x:atom()}}return e}
var r=expr();if(p<t.length)throw new Error('Unexpected '+t[p]);return r}
function fv(e,s){s=s||{};if(e.k==='v')s[e.n]=1;else if(e.k==='a'){fv(e.f,s);fv(e.x,s)}else{var o={};fv(e.b,o);delete o[e.x];for(var k in o)s[k]=1}return s}
function fresh(n,avoid){var m=n.replace(/'+$/,'');while(avoid[n])n+="'";return n}
function sub(e,x,v){if(e.k==='v')return e.n===x?v:e;if(e.k==='a')return {k:'a',f:sub(e.f,x,v),x:sub(e.x,x,v)};
if(e.x===x)return e;var f=fv(v);if(f[e.x]){var a=fv(e.b);a[x]=1;for(var k in f)a[k]=1;var n=fresh(e.x,a);return sub({k:'l',x:n,b:sub(e.b,e.x,{k:'v',n:n})},x,v)}
return {k:'l',x:e.x,b:sub(e.b,x,v)}}
function step(e){if(e.k==='a'){if(e.f.k==='l')return sub(e.f.b,e.f.x,e.x);var f=step(e.f);if(f)return {k:'a',f:f,x:e.x};var x=step(e.x);if(x)return {k:'a',f:e.f,x:x};return null}
if(e.k==='l'){var b=step(e.b);return b?{k:'l',x:e.x,b:b}:null}return null}
function show(e,pa){if(e.k==='v')return e.n;if(e.k==='l'){var s='λ'+e.x+'. '+show(e.b,false);return pa?'('+s+')':s}
var s2=show(e.f,e.f.k==='l')+' '+show(e.x,e.x.k!=='v');return pa?'('+s2+')':s2}
var cur=null,n=0,out=document.getElementById('out'),msg=document.getElementById('msg'),reduced=0;
function start(){try{cur=parse(document.getElementById('in').value);n=0;reduced=0;out.textContent='0: '+show(cur,false);msg.textContent='Parsed. Press Step.';msg.className='m'}catch(e){cur=null;out.textContent='';msg.textContent=e.message;msg.className='err'}}
function one(){if(!cur){start();return false}var nx=step(cur);if(!nx){msg.textContent='Normal form reached after '+n+' steps.';msg.className='m';if(n>=3)done();return false}
cur=nx;n++;out.textContent+='\n'+n+': '+show(cur,false);if(n>200){msg.textContent='Stopped after 200 steps (this term may not terminate).';return false}return true}
document.getElementById('go').onclick=start;document.getElementById('st').onclick=function(){if(!cur)start();else one()};
document.getElementById('all').onclick=function(){if(!cur)start();var g=0;while(cur&&g++<200&&one());};
var EX=[['S K K a','(\\x. \\y. \\z. x z (y z)) (\\x. \\y. x) (\\x. \\y. x) a'],['K','(\\x. \\y. x) a b'],['Self-apply','(\\x. x x) (\\y. y)'],['Church 2','(\\f. \\x. f (f x)) g z'],['Capture','(\\x. \\y. x y) y'],['Omega (loops)','(\\x. x x) (\\x. x x)']];
EX.forEach(function(p){var b=document.createElement('button');b.className='t';b.textContent=p[0];b.onclick=function(){document.getElementById('in').value=p[1];start()};document.getElementById('ex').appendChild(b)});
start();
</script></body></html>
